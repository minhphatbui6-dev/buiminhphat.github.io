<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMPDarkTool</title>
    <style>
        /* Reset & toàn cục */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar cố định */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .menu-btn {
            cursor: pointer;
            font-size: 20px;
            padding: 10px 18px;
            border: 1px solid white;
            border-radius: 8px;
            transition: 0.3s;
        }
        .menu-btn:hover {
            background: white;
            color: black;
        }

        /* Sidebar trượt từ trái */
        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #111;
            border-right: 1px solid #333;
            transition: 0.35s;
            padding-top: 80px;
            z-index: 999;
            overflow-y: auto;
        }
        .sidebar.active {
            left: 0;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .tool {
            padding: 18px;
            margin: 10px;
            background: #181818;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid #2c2c2c;
        }
        .tool:hover {
            background: #fff;
            color: #000;
            transform: translateX(8px);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
        }

        /* Nội dung chính */
        .main {
            margin-top: 90px;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
        }

        h1 {
            margin-top: 20px;
            font-size: 40px;
        }

        .main p {
            margin-top: 15px;
            font-size: 18px;
            color: #ccc;
        }

        /* Chỉ giữ lại ô Kho Tool - thu nhỏ */
        .box {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 200px;
            padding: 20px;
            background: #101010;
            border: 1px solid #333;
            border-radius: 15px;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: white;
        }

        .card h2 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .card p {
            margin: 10px 0;
            color: #bbb;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.8;
            transform: scale(0.97);
        }

        /* Phần chữ AA và link ở cuối */
        .footer {
            margin-top: 50px;
            color: #888;
            font-size: 14px;
        }
        .footer a {
            color: #aaa;
            text-decoration: none;
        }
        .footer a:hover {
            color: white;
        }
    </style>
</head>

<body>

    <!-- Thanh điều hướng -->
    <nav>
        <div class="menu-btn" onclick="openMenu()">☰ Kho Tool</div>
        <div class="logo">BMPDarkTool</div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="close" onclick="closeMenu()">✖</div>
        <h2>Kho Tool</h2>

        <div class="tool">🔧 Tool Encode</div>
        <div class="tool">🔐 Tool Password</div>
        <div class="tool">📱 Tool IMEI</div>
        <div class="tool">🌐 Tool IP Lookup</div>
        <div class="tool">🛰 Tool Ping</div>
        <div class="tool">⚡ Tool Base64</div>
        <div class="tool">📦 Tool JSON</div>
        <div class="tool">📝 Tool Text</div>
        <div class="tool">📂 Tool Upload</div>
        <div class="tool">⚙ Cài đặt</div>
    </div>

    <!-- Nội dung chính -->
    <div class="main">
        <!-- Ảnh đại diện -->
        <img class="avatar" src="https://files.catbox.moe/kxygoi.png" alt="Avatar" />

        <h1>BMPDarkTool</h1>
        <p>Website Profile &amp; Tool Collection</p>

        <!-- Chỉ giữ lại 1 ô Kho Tool duy nhất, kích thước nhỏ hơn -->
        <div class="box">
            <div class="card">
                <h2>📦 Kho Tool</h2>
                <p>Bấm góc trái để mở tất cả công cụ.</p>
                <button onclick="openMenu()">Mở Kho</button>
            </div>
        </div>

        <!-- Phần chữ AA và link ở cuối -->
        <div class="footer">
            <span>AA</span> &bull; 
            <a href="#" target="_blank">hphatbui6-dev.github.io</a>
        </div>
    </div>

    <!-- JavaScript điều khiển Sidebar -->
    <script>
        function openMenu() {
            document.getElementById("sidebar").classList.add("active");
        }

        function closeMenu() {
            document.getElementById("sidebar").classList.remove("active");
        }
    </script>

</body>
</html>
