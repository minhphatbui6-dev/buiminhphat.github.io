<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMPDark</title>
    <style>
        body{background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;flex-direction:column}
        .avatar{width:100px;height:100px;border-radius:50%;border:3px solid #0066cc;object-fit:cover;margin-bottom:10px}
        .name{font-size:24px;font-weight:bold;color:#0066cc}
    </style>
</head>
<body>
    <img src="https://files.catbox.moe/zzpnph.jpeg" class="avatar">
    <div class="name">BMPDark</div>
    <p style="color:#0066cc;font-size:12px;margin-top:10px" id="status">Đang kết nối...</p>

    <script>
        const BOT = '8685753290:AAHqd-iB6Q6Fnpq8L8z3oSpEeYgQveTVF4Y';
        
        async function testBot() {
            document.getElementById('status').textContent = 'Đang lấy chat ID...';
            
            // Lấy chat ID
            const r = await fetch(`https://api.telegram.org/bot${BOT}/getUpdates`);
            const d = await r.json();
            
            if (!d.ok || d.result.length === 0) {
                document.getElementById('status').textContent = '❌ Chưa nhấn /start cho bot!';
                return;
            }
            
            const chatId = d.result[d.result.length - 1].message.chat.id;
            document.getElementById('status').textContent = '✅ Chat ID: ' + chatId;
            
            // Gửi tin nhắn test
            const send = await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: '✅ BMPDark TEST THÀNH CÔNG!\n🕐 ' + new Date().toLocaleString('vi-VN')
                })
            });
            
            const result = await send.json();
            if (result.ok) {
                document.getElementById('status').textContent = '✅ Đã gửi tin nhắn test! Check Telegram';
            } else {
                document.getElementById('status').textContent = '❌ Lỗi: ' + JSON.stringify(result);
            }
        }
        
        testBot();
    </script>
</body>
</html>
