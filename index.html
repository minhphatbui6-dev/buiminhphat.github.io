    <!-- Script xử lý nhạc nền ẩn và hiệu ứng hạt -->
    <script>
        // Khởi tạo hiệu ứng hạt lấp lánh ngẫu nhiên
        const container = document.getElementById('particle-container');
        const particleCount = 45;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 4 + 1.5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 8 + 5}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(particle);
        }

        // Kích hoạt phát nhạc ngay khi người dùng chạm vào màn hình
        const music = document.getElementById('bg-music');
        let hasInteracted = false;

        function startAudio() {
            if (!hasInteracted) {
                music.play().then(() => {
                    hasInteracted = true;
                    window.removeEventListener('click', startAudio);
                    window.removeEventListener('touchstart', startAudio);
                    window.removeEventListener('touchend', startAudio);
                }).catch(err => {
                    console.log("Đợi người dùng tương tác...");
                });
            }
        }

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);
        window.addEventListener('touchend', startAudio);
    </script>
