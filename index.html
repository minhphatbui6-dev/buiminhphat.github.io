            if (!password) {
                errorMsg.textContent = '❌ Vui lòng nhập mật khẩu!';
                input.classList.add('error');
                return;
            }
            if (password === PASSWORD) {

                input.value = '';
                input.focus();
                setTimeout(() => input.classList.remove('error'), 500);
            }

        // ===== CÔNG NGHỆ =====
        function detectTechnologyPro(html) {
            const tech = [];
            const lower = html.toLowerCase();
            const techList = [
                { name: 'WordPress', patterns: ['wordpress','wp-content','wp-includes'] },
                { name: 'Shopify', patterns: ['shopify','cdn.shopify'] },
                { name: 'Laravel', patterns: ['laravel','csrf-token','_token'] },
                { name: 'Django', patterns: ['django','csrfmiddlewaretoken'] },
                { name: 'React', patterns: ['react','_react','react-dom'] },
                { name: 'Vue.js', patterns: ['vue','v-bind','v-for','v-if'] },
                { name: 'Angular', patterns: ['angular','ng-'] },
                { name: 'Bootstrap', patterns: ['bootstrap','class="container','col-md-'] },
                { name: 'Tailwind CSS', patterns: ['tailwind','class="flex','class="grid'] },
                { name: 'jQuery', patterns: ['jquery','jQuery'] },
                { name: 'PHP', patterns: ['php','.php'] },
                { name: 'ASP.NET', patterns: ['asp.net','__viewstate','asp'] },
                { name: 'Nginx', patterns: ['nginx'] },
                { name: 'Apache', patterns: ['apache'] },
                { name: 'Cloudflare', patterns: ['cloudflare','cf-'] },
                { name: 'Google Analytics', patterns: ['ga('] },
                { name: 'Facebook Pixel', patterns: ['fbq('] },
                { name: 'Zalo', patterns: ['zalo','zaloapp'] },
                { name: 'Momo', patterns: ['momo'] }
            ];
            for (const t of techList) {
                for (const p of t.patterns) {
                    if (lower.includes(p)) { if (!tech.includes(t.name)) tech.push(t.name); break; }
                }
            }
            return tech;
        }

        // ===== PHÂN TÍCH PRO =====
        async function analyzeWebsitePRO() {
            const url = document.getElementById('siteInput').value.trim();
            const resDiv = document.getElementById('analyzeResult');

            if (!url) {
                resDiv.innerHTML = '<div class="status-text" style="color:#f44;">⚠️ Vui lòng nhập URL.</div>';
                return;
            }

            let validUrl;
            try { validUrl = new URL(url); } catch(e) {
                resDiv.innerHTML = `<div class="status-text" style="color:#f44;">❌ URL không hợp lệ.</div>`;
                return;
            }

            resDiv.innerHTML = `<div class="status-text">⏳ Đang phân tích PRO ${validUrl.hostname} ...</div>`;

            try {
                const fetchRes = await fetch(validUrl.href, { signal: AbortSignal.timeout(10000) });
                const html = await fetchRes.text();

                const titleMatch = html.match(/<title>([^<]*)<\/title>/i);
                const title = titleMatch ? titleMatch[1].trim() : 'Không có title';

                const descMatch = html.match(/<meta\s+name=["']description["']\s+content=["']([^"']*)["']/i);
                const description = descMatch ? descMatch[1].trim() : 'Không có description';

                const kwMatch = html.match(/<meta\s+name=["']keywords["']\s+content=["']([^"']*)["']/i);
                const keywords = kwMatch ? kwMatch[1].trim() : 'Không có keywords';

                const h1Matches = html.match(/<h1[^>]*>([^<]*)<\/h1>/gi);
                const h1s = h1Matches ? h1Matches.map(m => m.replace(/<[^>]*>/g, '').trim()).filter(s => s.length > 0) : [];

                const h2Matches = html.match(/<h2[^>]*>([^<]*)<\/h2>/gi);
                const h2s = h2Matches ? h2Matches.map(m => m.replace(/<[^>]*>/g, '').trim()).filter(s => s.length > 0) : [];

                const h3Matches = html.match(/<h3[^>]*>([^<]*)<\/h3>/gi);
                const h3s = h3Matches ? h3Matches.map(m => m.replace(/<[^>]*>/g, '').trim()).filter(s => s.length > 0) : [];

                const text = html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

                const linkMatches = html.match(/<a\s+[^>]*href=["']([^"']*)["'][^>]*>/gi);
                const links = linkMatches ? linkMatches.map(m => {
                    const href = m.match(/href=["']([^"']*)["']/);
                    return href ? href[1] : '';
                }).filter(s => s && !s.startsWith('#') && !s.startsWith('javascript:')) : [];

                const imgMatches = html.match(/<img\s+[^>]*src=["']([^"']*)["'][^>]*>/gi);
                const images = imgMatches ? imgMatches.map(m => {
                    const src = m.match(/src=["']([^"']*)["']/);
                    return src ? src[1] : '';
                }).filter(s => s) : [];

                const combinedText = (text + ' ' + title + ' ' + description + ' ' + keywords + ' ' + h1s.join(' ') + ' ' + h2s.join(' ') + ' ' + h3s.join(' ')).toLowerCase();
                const categoryScores = [];
                for (const cat of categoryRules) {
                    let score = 0;
                    for (const kw of cat.keywords) {
                        const regex = new RegExp(kw.toLowerCase(), 'gi');
                        const matches = (combinedText.match(regex) || []).length;
                        score += matches;
                    }
                    if (score > 0) categoryScores.push({ name: cat.name, score: score });
                }
                categoryScores.sort((a, b) => b.score - a.score);
                const topCategories = categoryScores.slice(0, 5);

                const tech = detectTechnologyPro(html);

                // Xây dựng bảng HTML
                let htmlResult = `<button class="copy-btn" onclick="copyAnalyzeResult()">📋 Sao chép</button>`;
                htmlResult += `<table class="result-table">`;
                htmlResult += `<tr><td class="label">🌐 URL</td><td class="value">${validUrl.href}</td></tr>`;
                htmlResult += `<tr><td class="label">📌 Tiêu đề</td><td class="value">${title}</td></tr>`;
                htmlResult += `<tr><td class="label">📝 Mô tả</td><td class="value">${description}</td></tr>`;
                htmlResult += `<tr><td class="label">🏷️ Từ khóa</td><td class="value">${keywords}</td></tr>`;
                htmlResult += `<tr><td class="label">📰 H1</td><td class="value">${h1s.slice(0, 3).join(' | ') || 'Không có'}</td></tr>`;
                htmlResult += `<tr><td class="label">📑 H2 (đầu)</td><td class="value">${h2s.slice(0, 3).join(' | ') || 'Không có'}</td></tr>`;
                htmlResult += `<tr><td class="label">🔗 Liên kết</td><td class="value">${links.length}</td></tr>`;
                htmlResult += `<tr><td class="label">🖼️ Ảnh</td><td class="value">${images.length}</td></tr>`;

                // Lĩnh vực
                let catHtml = '';
                if (topCategories.length > 0) {
                    for (const cat of topCategories) {
                        catHtml += `<span class="category-tag">${cat.name} <span class="score">(${cat.score} từ)</span></span> `;
                    }
                } else {
                    catHtml = '<span style="color:#ffaa00;">⚠️ Không xác định rõ lĩnh vực.</span>';
                }
                htmlResult += `<tr><td class="label">🎯 Lĩnh vực</td><td class="value">${catHtml}</td></tr>`;

                // Công nghệ
                let techHtml = tech.length > 0 ? tech.map(t => `<span class="category-tag">${t}</span>`).join(' ') : 'Không phát hiện';
                htmlResult += `<tr><td class="label">⚙️ Công nghệ</td><td class="value">${techHtml}</td></tr>`;

                // Tóm tắt
                const preview = text.slice(0, 400) + (text.length > 400 ? '...' : '');
                htmlResult += `<tr><td class="label">📄 Tóm tắt</td><td class="value">${preview}</td></tr>`;

                htmlResult += `<tr><td class="label" style="border-bottom: none; color:#666;">💡 Ghi chú</td>
                               <td class="value" style="border-bottom: none; color:#666; font-size:12px;">Phân tích dựa trên ${categoryRules.length} nhóm với ${categoryRules.reduce((acc, c) => acc + c.keywords.length, 0)} từ khóa.</td></tr>`;
                htmlResult += `</table>`;

                resDiv.innerHTML = htmlResult;

            } catch (e) {
                resDiv.innerHTML = `<div class="status-text" style="color:#f44;">❌ Lỗi: ${e.message}</div>`;
            }
        }

        function copyAnalyzeResult() {
            const content = document.querySelector('#analyzeResult .result-table');
            if (!content) return;
            // Lấy text thuần từ bảng
            const rows = content.querySelectorAll('tr');
            let text = '';
            for (const row of rows) {
                const cells = row.querySelectorAll('td');
                if (cells.length === 2) {
                    text += cells[0].textContent.trim() + ': ' + cells[1].textContent.trim() + '\n';
                }
            }
            navigator.clipboard.writeText(text)
                .then(() => alert('✅ Đã sao chép!'))
                .catch(() => alert('Không thể sao chép.'));
        }

        function clearAnalyze() {
            document.getElementById('siteInput').value = '';
            document.getElementById('analyzeResult').innerHTML = `<div class="status-text">Nhập URL và bấm "Phân tích PRO".</div>`;
        }
    </script>
</body>
</html>
