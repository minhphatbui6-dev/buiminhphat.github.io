<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bui Minh Phat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .app-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .ios-badge {
            background: #f1f5f9;
            color: #64748b;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 px-2">
            <span class="text-2xl">🔔</span>
        </div>

        <!-- Section Tiêu đề -->
        <h2 class="text-center text-sm font-bold text-gray-400 mb-6 tracking-widest uppercase">— LOCKET GOLD —</h2>

        <!-- Card ứng dụng -->
        <div class="app-card flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img src="https://files.catbox.moe/awlpvc.jpeg" class="w-14 h-14 rounded-2xl object-cover">
                <div>
                    <h3 class="font-bold text-lg">Locket Gold</h3>
                    <span class="ios-badge mt-1"> iOS</span>
                </div>
            </div>
            <a href="https://storeipa.com/w4wg4p" target="_blank" class="p-3 bg-gray-50 rounded-full hover:bg-blue-50 transition">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </a>
        </div>
    </div>

</body>
</html>
