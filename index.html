<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeepSeek AI - Trợ lý thông minh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .chat-container {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: #2a2a3c;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid #3d3d5c;
    }
    .chat-header {
      background: #1e1e2e;
      padding: 18px 24px;
      border-bottom: 1px solid #3d3d5c;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .logo {
      width: 38px;
      height: 38px;
      background: #6c5ce7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
    }
    .chat-header h1 {
      color: #e0e0ff;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .chat-header .model-badge {
      margin-left: auto;
      background: #3d3d5c;
      color: #b0b0d0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #2a2a3c;
    }
    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      flex-direction: row-reverse;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #3d3d5c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .message.user .avatar {
      background: #6c5ce7;
      color: white;
    }
    .message.assistant .avatar {
      background: #00b894;
      color: white;
    }
    .bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .message.user .bubble {
      background: #6c5ce7;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant .bubble {
      background: #1e1e2e;
      color: #d0d0e8;
      border-bottom-left-radius: 4px;
      border: 1px solid #3d3d5c;
    }
    .bubble code {
      background: #0d0d1a;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #f8c555;
    }
    .bubble pre {
      background: #0d0d1a;
      padding: 14px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 0.8rem;
      border: 1px solid #3d3d5c;
    }
    .chat-input-area {
      padding: 16px 20px;
      background: #1e1e2e;
      border-top: 1px solid #3d3d5c;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .chat-input-area textarea {
      flex: 1;
      background: #2a2a3c;
      border: 1px solid #3d3d5c;
      border-radius: 18px;
      padding: 14px 18px;
      color: #e0e0ff;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 140px;
      transition: border 0.2s;
    }
    .chat-input-area textarea:focus {
      border-color: #6c5ce7;
    }
    .chat-input-area button {
      background: #6c5ce7;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-input-area button:hover {
      background: #5a4bd1;
    }
    .chat-input-area button:active {
      transform: scale(0.94);
    }
    .chat-input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 8px 0;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #6c5ce7;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }
    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="logo">🧠</div>
      <h1>DeepSeek AI</h1>
      <span class="model-badge">DeepSeek-V3</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <textarea id="userInput" rows="1" placeholder="Đặt câu hỏi phức tạp..."></textarea>
      <button id="sendBtn" title="Gửi">➤</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- CẤU HÌNH API ----------
      const API_KEY = 'sk-or-v1-7d04691b2b4c8a7c3b2f5a9e1d4c6b8a2f3e0d1c5b7a9f8e4d2c1b6a0f3e7d9'; 
      const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
      const SITE_URL = window.location.href;
      const SITE_NAME = 'DeepSeek AI Chat';

      // ---------- DOM ----------
      const chatMessages = document.getElementById('chatMessages');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');

      // Lịch sử hội thoại (giữ ngữ cảnh)
      let conversationHistory = [
        {
          role: 'system',
          content: 'Bạn là DeepSeek AI, một trợ lý thông minh vượt trội. Bạn trả lời cực kỳ chi tiết, chính xác, phân tích sâu các câu hỏi phức tạp về toán, lý, hóa, lập trình, khoa học, logic, triết học, kỹ thuật. Bạn sử dụng tiếng Việt tự nhiên, thân thiện. Khi cần bạn đưa ra code, công thức, bảng biểu, giải thích từng bước. Luôn giữ giọng điệu chuyên nghiệp nhưng gần gũi.'
        }
      ];

      // ---------- HÀM HIỂN THỊ TIN NHẮN ----------
      function addMessage(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '👤' : '🤖';
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = formatContent(content);
        
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
        return bubble;
      }

      function formatContent(text) {
        let formatted = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        
        formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
          return `<pre><code class="language-${lang || 'plaintext'}">${code.trim()}</code></pre>`;
        });
        
        formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
        
        formatted = formatted.replace(/^### (.*$)/gim, '<h3 style="color:#c4b5fd; margin:8px 0 4px;">$1</h3>');
        formatted = formatted.replace(/^## (.*$)/gim, '<h2 style="color:#a78bfa; margin:10px 0 4px;">$1</h2>');
        formatted = formatted.replace(/^# (.*$)/gim, '<h1 style="color:#8b5cf6; margin:12px 0 4px;">$1</h1>');
        
        formatted = formatted.replace(/^- (.*$)/gim, '<li style="margin-left:16px;">• $1</li>');
        formatted = formatted.replace(/^(\d+)\. (.*$)/gim, '<li style="margin-left:16px;">$1. $2</li>');
        
        return formatted;
      }

      function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message assistant';
        typingDiv.id = 'typingIndicator';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        typingDiv.appendChild(avatar);
        typingDiv.appendChild(bubble);
        chatMessages.appendChild(typingDiv);
        scrollToBottom();
      }

      function removeTypingIndicator() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
      }

      // ---------- GỌI API OPENROUTER (DeepSeek) ----------
      async function callDeepSeekAPI(userMessage) {
        conversationHistory.push({ role: 'user', content: userMessage });
        
        const payload = {
          model: 'deepseek/deepseek-chat',
          messages: conversationHistory,
          temperature: 0.7,
          top_p: 0.9,
          max_tokens: 4096,
          stream: false
        };

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`,
            'HTTP-Referer': SITE_URL,
            'X-Title': SITE_NAME,
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `Lỗi API: ${response.status}`);
        }

        const data = await response.json();
        const assistantMessage = data.choices[0].message.content;
        
        conversationHistory.push({ role: 'assistant', content: assistantMessage });
        
        if (conversationHistory.length > 20) {
          conversationHistory = [
            conversationHistory[0],
            ...conversationHistory.slice(-18)
          ];
        }
        
        return assistantMessage;
      }

      // ---------- XỬ LÝ GỬI TIN NHẮN ----------
      async function handleSend() {
        const message = userInput.value.trim();
        if (!message) return;
        
        addMessage('user', message);
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;
        
        showTypingIndicator();
        
        try {
          const reply = await callDeepSeekAPI(message);
          removeTypingIndicator();
          const bubble = addMessage('assistant', reply);
        } catch (error) {
          removeTypingIndicator();
          const errorMsg = `⚠️ Lỗi: ${error.message}. Vui lòng kiểm tra API key hoặc kết nối mạng.`;
          addMessage('assistant', errorMsg);
          conversationHistory.push({ role: 'assistant', content: errorMsg });
        } finally {
          sendBtn.disabled = false;
          userInput.focus();
        }
      }

      // ---------- AUTO RESIZE TEXTAREA ----------
      userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 140) + 'px';
      });

      // ---------- SỰ KIỆN ----------
      sendBtn.addEventListener('click', handleSend);
      userInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      // Khởi tạo với tin nhắn chào
      window.addEventListener('load', () => {
        const welcomeMsg = 'Xin chào! Tôi là DeepSeek AI, trợ lý thông minh sẵn sàng giải đáp mọi câu hỏi phức tạp của bạn. Hãy hỏi tôi bất cứ điều gì về toán học, lập trình, khoa học, logic hay phân tích chuyên sâu nhé! 🚀';
        addMessage('assistant', welcomeMsg);
        conversationHistory.push({ role: 'assistant', content: welcomeMsg });
      });
    })();
  </script>
</body>
</html>
