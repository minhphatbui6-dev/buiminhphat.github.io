    <style>
        /* Hiệu ứng tuyết rơi từ trên xuống, đung đưa nhẹ sang hai bên */
        @keyframes snowFallEffect {
            0% {
                transform: translateY(-20px) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) translateX(35px) scale(0.8);
                opacity: 0;
            }
        }
        .snowflake {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: snowFallEffect linear infinite;
            /* Tạo hiệu ứng phát sáng mờ ảo cho hạt tuyết tròn */
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        /* Giấu thanh cuộn trình duyệt */

        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- Logic tạo hạt tuyết rơi ngẫu nhiên -->
    <script>
        const container = document.getElementById('snow-container');
        // Số lượng hạt tuyết xuất hiện cùng lúc trên màn hình
        const snowflakeCount = 55;
        
        for (let i = 0; i < snowflakeCount; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            
            // Tạo kích thước hạt tuyết ngẫu nhiên từ to đến nhỏ (2px - 6px)
            const size = Math.random() * 4 + 2;
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;
            
            // Rải đều vị trí xuất hiện ngang màn hình
            snowflake.style.left = `${Math.random() * 100}%`;
            
            // Tạo vị trí chiều dọc ban đầu ngẫu nhiên để tuyết rơi đều, không bị rơi cùng một lượt
            snowflake.style.top = `${Math.random() * -20 - 5}px`;
            
            // Tốc độ rơi ngẫu nhiên từ 4 giây đến 9 giây
            snowflake.style.animationDuration = `${Math.random() * 5 + 4}s`;
            // Thời gian chờ xuất hiện ngẫu nhiên
            snowflake.style.animationDelay = `${Math.random() * 6}s`;
            
            container.appendChild(snowflake);
        }

        // Tự động bật nhạc khi người dùng tương tác với trang web
        const music = document.getElementById('bg-music');
        let hasInteracted = false;

        function startAudio() {
            if (!hasInteracted) {
                music.play().then(() => {
                    hasInteracted = true;
                    window.removeEventListener('click', startAudio);
                    window.removeEventListener('touchstart', startAudio);
                }).catch(err => {
                    console.log("Đang chờ chạm màn hình để phát nhạc...");
                });
            }
        }

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);
    </script>
