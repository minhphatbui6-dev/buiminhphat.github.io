<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bui Minh Phat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html, body { background-color: #ffffff; color: #1f2937; margin: 0; padding: 0; min-height: 100vh; }
        #loading-screen { transition: opacity 0.5s ease; }
    </style>
</head>
<body>

    <div id="loading-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white">
        <div class="w-32 h-32 rounded-full overflow-hidden border border-gray-100 shadow-xl mb-6">
            <img src="https://files.catbox.moe/n0x8oo.jpeg" class="w-full h-full object-cover">
        </div>
        <h1 class="text-2xl font-bold italic text-gray-900 mb-8">Bui Minh Phat</h1>
        <button onclick="startExperience()" class="px-6 py-2 border border-gray-200 rounded-full text-gray-400 hover:text-gray-900 transition animate-pulse">
            Chạm để vào
        </button>
    </div>

    <audio id="music-1">
        <source src="https://files.catbox.moe/uc4l2l.mov" type="audio/mp4">
    </audio>
    <audio id="music-2" loop>
        <source src="https://files.catbox.moe/77meij.mp3" type="audio/mp3">
    </audio>

    <div class="max-w-md mx-auto px-5 py-14 flex flex-col items-center">
        <div class="fixed top-4 left-4 z-50 px-4 py-1.5 bg-gray-100 border border-black/5 rounded-full backdrop-blur-md shadow-sm flex items-center space-x-2.5">
            <span id="digital-clock" class="text-sm font-bold tracking-wider text-gray-800">00:00:00</span>
            <span class="text-xs">🌙</span>
        </div>

        <header class="flex flex-col items-center text-center w-full pt-12">
            <div class="w-28 h-28 rounded-full overflow-hidden border border-black/5 shadow-xl mb-4">
                <img src="https://files.catbox.moe/n0x8oo.jpeg" class="w-full h-full object-cover">
            </div>
            <h1 class="text-3xl font-bold italic tracking-wide text-gray-900 mb-2">Bui Minh Phat</h1>
            <p class="text-sm text-gray-500 font-light tracking-wide">id tiktok <span class="font-normal">buiminhphat20</span></p>
        </header>

        <main class="w-full mt-6 space-y-4">
            <a href="https://storeipa.com/w4wg4p" target="_blank" class="flex items-center space-x-4 w-full p-4 bg-gray-50 border border-black/5 rounded-2xl hover:bg-gray-100 transition-all">
                <img src="https://files.catbox.moe/awlpvc.jpeg" class="w-14 h-14 rounded-xl object-cover border border-black/5">
                <div class="flex-1 text-left">
                    <span class="block font-bold text-gray-900 text-lg">Locket Gold</span>
                </div>
            </a>
        </main>
    </div>

    <script>
        const music1 = document.getElementById('music-1');
        const music2 = document.getElementById('music-2');
        const loading = document.getElementById('loading-screen');

        function startExperience() {
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);
            
            // Phát nhạc 1
            music1.play().catch(e => console.log("Lỗi phát nhạc 1"));
        }

        // Khi nhạc 1 kết thúc -> Tự động phát nhạc 2
        music1.onended = function() {
            music2.play().catch(e => console.log("Lỗi phát nhạc 2"));
        };

        function updateClock() {
            document.getElementById('digital-clock').textContent = new Date().toLocaleTimeString('vi-VN');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
