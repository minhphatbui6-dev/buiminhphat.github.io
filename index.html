<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Thanh Tâm...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #2d3436;
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .highlight {
            color: #e84393;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #ff7675;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4);
        }

        #yesBtn:hover {
            background-color: #d63031;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #b2bec3;
            color: white;
            position: absolute;
        }

        .heart {
            position: absolute;
            color: #ff7675;
            font-size: 20px;
            animation: flyUp 4s linear infinite;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-500px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        <h1>Ê <span class="highlight">Thanh Tâm</span>! Làm người yêu bớt làm bạn thân đi, chịu hông? 😏</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Chịu luôn á 🥰</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Còn lâu nhé ế</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function sayYes() {
            const card = document.getElementById('card');
            card.innerHTML = `
                <h1 style="color: #e84393;">Hợp lý quá nha! 🎉</h1>
                <p style="color: #636e72; font-size: 18px; margin-top: 15px;">Từ giờ đổi chức vụ từ bạn thân thành "gấu" của nhau luôn nhé Tâm ơi! ❤️</p>
            `;
            createHearts();
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.bottom = '0px';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }, 300);
        }
    </script>
</body>
</html>
