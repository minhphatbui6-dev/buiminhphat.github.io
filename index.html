<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hành Trình Kỳ Diệu Của Thanh Tâm 🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .game-container {
            position: relative;
            width: 850px;
            height: 450px;
            background: linear-gradient(to bottom, #ff758c, #ff7eb3, #ffd1ff);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        /* Các lớp mây bay chill */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            animation: moveCloud linear infinite;
        }

        @keyframes moveCloud {
            from { right: -200px; }
            to { right: 1050px; }
        }

        /* Mặt đất chi tiết */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, #11998e, #38ef7d);
            border-top: 5px solid #00b894;
        }

        .grass-detail {
            position: absolute;
            bottom: 80px;
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(45deg, #2ecc71, #2ecc71 10px, #27ae60 10px, #27ae60 20px);
        }

        /* Nhân vật Thanh Tâm Pro */
        #player {
            position: absolute;
            bottom: 85px;
            left: 60px;
            width: 60px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .name-tag {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 3px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 12px;
            white-space: nowrap;
            margin-bottom: 6px;
            box-shadow: 0 3px 10px rgba(255, 65, 108, 0.5);
            animation: bounceName 1s ease-in-out infinite alternate;
        }

        @keyframes bounceName {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        .avatar {
            width: 50px;
            height: 65px;
            background: #ff7675;
            border-radius: 25px 25px 12px 12px;
            position: relative;
            box-shadow: inset -6px -6px 0px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.2);
        }

        .avatar::before {
            content: '💖';
            position: absolute;
            font-size: 38px;
            top: 8px;
            left: 6px;
        }

        /* Chướng ngại vật đa dạng */
        .obstacle {
            position: absolute;
            bottom: 85px;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            animation: moveObstacle linear infinite;
            z-index: 4;
        }

        @keyframes moveObstacle {
            from { right: -60px; }
            to { right: 910px; }
        }

        /* Bảng điểm & Giao diện */
        .score-board {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #2d3436;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 18px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Màn hình kết thúc / Bắt đầu */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .overlay-screen h1 {
            font-size: 36px;
            color: #ff758c;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(255, 117, 140, 0.4);
        }

        .overlay-screen p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #dfe6e9;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 176, 155, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.6);
        }

        #gameOverScreen {
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="cloud" style="top: 35px; width: 90px; height: 28px; animation-duration: 9s;"></div>
        <div class="cloud" style="top: 90px; width: 140px; height: 35px; animation-duration: 14s;"></div>
        <div class="cloud" style="top: 50px; width: 70px; height: 22px; animation-duration: 7s; animation-delay: 3s;"></div>

        <div class="score-board">Điểm: <span id="score">0</span></div>

        <div id="player">
            <div class="name-tag">Thanh Tâm ✨</div>
            <div class="avatar"></div>
        </div>

        <div class="grass-detail"></div>
        <div class="ground"></div>

        <div class="overlay-screen" id="startScreen">
            <h1>Hành Trình Của Thanh Tâm 🌸</h1>
            <p>Nhấn Phím <b>Space</b> hoặc <b>Chạm màn hình</b> để nhảy qua chướng ngại vật và săn điểm nhé!</p>
            <button class="btn" onclick="startGame()">Bắt đầu phiêu lưu</button>
        </div>

        <div class="overlay-screen" id="gameOverScreen">
            <h1>Ôi, vấp ngã mất tiêu rồi! 🥺</h1>
            <p>Điểm số xuất sắc của Thanh Tâm: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">Thử lại nha</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');

        let isJumping = false;
        let score = 0;
        let obstacleInterval;
        let isPlaying = false;

        // Danh sách các chướng ngại vật ngẫu nhiên (Ngựa 🐎, Xương rồng 🌵, Hộp quà 🎁)
        const obstacleTypes = ['🐎', '🌵', '🎁'];

        function jump() {
            if (isJumping || !isPlaying) return;
            isJumping = true;
            let jumpHeight = 0;
            
            let upInterval = setInterval(() => {
                if (jumpHeight >= 140) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (jumpHeight <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        } else {
                            jumpHeight -= 7;
                            player.style.bottom = (85 + jumpHeight) + 'px';
                        }
                    }, 20);
                } else {
                    jumpHeight += 7;
                    player.style.bottom = (85 + jumpHeight) + 'px';
                }
            }, 20);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        gameContainer.addEventListener('click', () => {
            jump();
        });

        function createObstacle() {
            if (!isPlaying) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            
            // Chọn ngẫu nhiên chướng ngại vật
            const randomObs = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            obstacle.innerHTML = randomObs;
            
            // Tốc độ tăng dần theo điểm
            let obstacleDuration = Math.max(1.1, 2.4 - (score * 0.04));
            obstacle.style.animationDuration = obstacleDuration + 's';
            
            gameContainer.appendChild(obstacle);

            let checkCollision = setInterval(() => {
                const playerRect = player.getBoundingClientRect();
                const obstacleRect = obstacle.getBoundingClientRect();

                // Kiểm tra va chạm chuẩn xác
                if (
                    playerRect.right - 12 > obstacleRect.left &&
                    playerRect.left + 12 < obstacleRect.right &&
                    playerRect.bottom - 10 > obstacleRect.top
                ) {
                    clearInterval(checkCollision);
                    gameOver();
                }

                // Xóa và cộng điểm
                if (obstacleRect.right < gameContainer.getBoundingClientRect().left) {
                    clearInterval(checkCollision);
                    obstacle.remove();
                    if (isPlaying) {
                        score += (randomObs === '🎁' ? 20 : 10); // Hộp quà được thưởng gấp đôi điểm!
                        scoreDisplay.innerText = score;
                    }
                }
            }, 40);

            setTimeout(() => {
                if (obstacle.parentNode) {
                    obstacle.remove();
                }
            }, obstacleDuration * 1000);
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            score = 0;
            scoreDisplay.innerText = score;
            isPlaying = true;
            
            obstacleInterval = setInterval(createObstacle, 1800);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(obstacleInterval);
            
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());

            finalScoreDisplay.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }
    </script>
</body>
</html>
