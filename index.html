<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Creator Pro - Tạo Proxy + Gmail Hàng Loạt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0e1a, #141b2b);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 36px;
            padding: 35px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
        }
        h1 span {
            color: #64ffda;
        }
        .sub {
            text-align: center;
            color: #8892b0;
            font-size: 14px;
            margin: 6px 0 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .tab-wrap {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #8892b0;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: rgba(100, 255, 218, 0.12);
            border-color: #64ffda;
            color: #64ffda;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.05);
        }
        .tab-btn:hover {
            background: rgba(255,255,255,0.05);
        }
        .panel {
            display: none;
            animation: fade 0.3s ease;
        }
        .panel.active {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ccd6f6;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        input, textarea, select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #e6f1ff;
            font-size: 15px;
            outline: none;
            transition: 0.25s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #64ffda;
            background: rgba(100,255,218,0.03);
            box-shadow: 0 0 0 3px rgba(100,255,218,0.08);
        }
        .row-2 {
            display: flex;
            gap: 16px;
        }
        .row-2 .form-group {
            flex: 1;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 16px;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: #64ffda;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            color: #a8b2d1;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 22px;
        }
        .btn {
            flex: 1;
            padding: 15px 10px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: #64ffda;
            color: #0a0e1a;
        }
        .btn-primary:hover {
            background: #52e0c0;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(100,255,218,0.2);
        }
        .btn-danger {
            background: rgba(255,80,80,0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255,80,80,0.15);
        }
        .btn-danger:hover {
            background: rgba(255,80,80,0.2);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #a8b2d1;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .log-area {
            margin-top: 25px;
            background: rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 16px 18px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .log-area p {
            color: #8a9bb5;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            line-height: 1.7;
            margin: 0;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .log-success { color: #64ffda !important; }
        .log-error { color: #ff6b6b !important; }
        .log-info { color: #64b5f6 !important; }
        .log-warn { color: #ffd93d !important; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            color: #495670;
            font-size: 13px;
        }
        .status-bar .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .dot.idle { background: #495670; }
        .dot.running { background: #64ffda; box-shadow: 0 0 12px #64ffda; }
        .dot.stopped { background: #ff6b6b; }
        .proxy-list-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 10px 14px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 13px;
            color: #a8b2d1;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .badge-count {
            background: rgba(100,255,218,0.12);
            color: #64ffda;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        @media (max-width: 550px) {
            .row-2 { flex-direction: column; gap: 0; }
            .container { padding: 22px 16px; }
            .tab-wrap { flex-direction: column; }
        }
        .log-area::-webkit-scrollbar { width: 4px; }
        .log-area::-webkit-scrollbar-track { background: transparent; }
        .log-area::-webkit-scrollbar-thumb { background: #64ffda; border-radius: 10px; }
        .proxy-list-box::-webkit-scrollbar { width: 3px; }
        .proxy-list-box::-webkit-scrollbar-thumb { background: #64ffda; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ G-<span>CREATOR</span> PRO</h1>
    <div class="sub">Tạo proxy thật + Tạo Gmail hàng loạt · Tích hợp 1 chạm</div>

    <!-- Tab -->
    <div class="tab-wrap">
        <button class="tab-btn active" data-tab="tabProxy">🌐 Tạo Proxy</button>
        <button class="tab-btn" data-tab="tabGmail">📧 Tạo Gmail</button>
    </div>

    <!-- PANEL 1: TẠO PROXY -->
    <div id="tabProxy" class="panel active">
        <div class="form-group">
            <label>Số lượng proxy muốn có (sau khi lọc)</label>
            <input type="number" id="proxySoLuong" value="30" min="5" max="200">
        </div>
        <div class="form-group">
            <label>Timeout kiểm tra (giây)</label>
            <input type="number" id="proxyTimeout" value="5" min="2" max="15">
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="proxyGhiFile" checked>
            <label for="proxyGhiFile">Tự động ghi vào <strong>proxy.txt</strong> (dùng cho tạo Gmail)</label>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnLayProxy">🔍 LẤY PROXY</button>
            <button class="btn btn-secondary" id="btnXemProxy">👁 Xem danh sách</button>
        </div>
        <div id="proxyDisplay" class="proxy-list-box" style="display:none; margin-top:15px;">-- chưa có --</div>
    </div>

    <!-- PANEL 2: TẠO GMAIL -->
    <div id="tabGmail" class="panel">
        <div class="row-2">
            <div class="form-group">
                <label>Số lượng tài khoản</label>
                <input type="number" id="gmailSoLuong" value="10" min="1" max="50">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="text" id="gmailMatKhau" value="Abc@123456">
            </div>
        </div>
        <div class="form-group">
            <label>Tiền tố username</label>
            <input type="text" id="gmailTienTo" value="zepdry">
        </div>
        <div class="form-group">
            <label>File proxy sử dụng (mặc định: proxy.txt)</label>
            <input type="text" id="gmailProxyFile" value="proxy.txt">
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="gmailHeadless" checked>
            <label for="gmailHeadless">Chạy nền (headless) - tăng tốc</label>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnTaoGmail">🚀 BẮT ĐẦU TẠO</button>
            <button class="btn btn-danger" id="btnDungGmail">⏹ DỪNG LẠI</button>
        </div>
    </div>

    <!-- LOG CHUNG -->
    <div class="log-area" id="logArea">
        <p class="log-info">⏳ Sẵn sàng ...</p>
    </div>
    <div class="status-bar">
        <span id="statusText"><span class="dot idle"></span> Đang chờ</span>
        <span id="logCount" class="badge-count">0</span>
    </div>
</div>

<script>
    // ========== LOGGING ==========
    const logArea = document.getElementById('logArea');
    const statusText = document.getElementById('statusText');
    const logCount = document.getElementById('logCount');
    let logCounter = 0;

    function addLog(msg, type = 'info') {
        const p = document.createElement('p');
        const time = new Date().toLocaleTimeString();
        p.textContent = `[${time}] ${msg}`;
        p.className = 'log-' + type;
        logArea.appendChild(p);
        logArea.scrollTop = logArea.scrollHeight;
        logCounter++;
        logCount.textContent = logCounter;
        while (logArea.children.length > 100) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function setStatus(text, state = 'idle') {
        const dot = state === 'idle' ? 'idle' : (state === 'running' ? 'running' : 'stopped');
        statusText.innerHTML = `<span class="dot ${dot}"></span> ${text}`;
    }

    // ========== TAB SWITCH ==========
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.tab;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(target).classList.add('active');
        });
    });

    // ========== TẠO PROXY (gọi API backend) ==========
    document.getElementById('btnLayProxy').addEventListener('click', async function() {
        const soLuong = parseInt(document.getElementById('proxySoLuong').value) || 30;
        const timeout = parseInt(document.getElementById('proxyTimeout').value) || 5;
        const ghiFile = document.getElementById('proxyGhiFile').checked;

        addLog(`🌐 Bắt đầu lấy proxy, mục tiêu ${soLuong} proxy hoạt động...`, 'info');
        setStatus('Đang lấy proxy...', 'running');
        this.disabled = true;

        try {
            const resp = await fetch('/api/lay_proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ so_luong: soLuong, timeout: timeout, ghi_file: ghiFile })
            });
            const data = await resp.json();
            if (data.status === 'success') {
                addLog(`✅ Lấy thành công ${data.so_luong} proxy`, 'success');
                addLog(`📁 Đã ghi vào ${data.file || 'proxy.txt'}`, 'info');
                // Hiển thị danh sách
                const display = document.getElementById('proxyDisplay');
                display.style.display = 'block';
                display.textContent = data.danh_sach.join('\n');
                setStatus(`Đã có ${data.so_luong} proxy`, 'idle');
            } else {
                addLog(`❌ Lỗi: ${data.msg || 'Không xác định'}`, 'error');
                setStatus('Lỗi lấy proxy', 'stopped');
            }
        } catch (e) {
            addLog(`🔥 Lỗi kết nối backend: ${e.message}`, 'error');
            setStatus('Lỗi kết nối', 'stopped');
        }
        this.disabled = false;
    });

    document.getElementById('btnXemProxy').addEventListener('click', async function() {
        try {
            const resp = await fetch('/api/doc_proxy?file=proxy.txt');
            const data = await resp.json();
            const display = document.getElementById('proxyDisplay');
            display.style.display = 'block';
            if (data.status === 'success' && data.danh_sach.length > 0) {
                display.textContent = data.danh_sach.join('\n');
                addLog(`👁 Đã tải ${data.danh_sach.length} proxy từ file`, 'info');
            } else {
                display.textContent = '-- chưa có proxy hoặc file trống --';
                addLog('⚠️ File proxy trống hoặc chưa tồn tại', 'warn');
            }
        } catch (e) {
            addLog(`🔥 Không thể đọc file proxy: ${e.message}`, 'error');
        }
    });

    // ========== TẠO GMAIL (gọi API backend) ==========
    let isRunning = false;
    let stopFlag = false;

    document.getElementById('btnTaoGmail').addEventListener('click', async function() {
        if (isRunning) {
            addLog('⚠️ Đang chạy, không thể khởi động lại!', 'warn');
            return;
        }
        const soLuong = parseInt(document.getElementById('gmailSoLuong').value) || 10;
        const matKhau = document.getElementById('gmailMatKhau').value.trim() || 'Abc@123456';
        const tienTo = document.getElementById('gmailTienTo').value.trim() || 'zepdry';
        const proxyFile = document.getElementById('gmailProxyFile').value.trim() || 'proxy.txt';
        const headless = document.getElementById('gmailHeadless').checked;

        if (!soLuong || soLuong < 1) {
            addLog('❌ Số lượng phải >= 1', 'error');
            return;
        }

        addLog(`🚀 Bắt đầu tạo ${soLuong} Gmail, tiền tố "${tienTo}", proxy từ "${proxyFile}"`, 'info');
        setStatus('Đang tạo Gmail...', 'running');
        isRunning = true;
        stopFlag = false;
        this.disabled = true;
        document.getElementById('btnDungGmail').disabled = false;

        try {
            const resp = await fetch('/api/tao_gmail', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    so_luong: soLuong,
                    mat_khau: matKhau,
                    tien_to: tienTo,
                    file_proxy: proxyFile,
                    headless: headless
                })
            });
            const data = await resp.json();
            if (data.status === 'success') {
                addLog(`✅ Tạo thành công ${data.thanh_cong}/${data.tong} tài khoản`, 'success');
                if (data.danh_sach && data.danh_sach.length) {
                    data.danh_sach.forEach(acc => addLog(`📧 ${acc}`, 'info'));
                }
                setStatus(`Hoàn tất: ${data.thanh_cong}/${data.tong}`, 'idle');
            } else {
                addLog(`❌ Lỗi: ${data.msg || 'Không xác định'}`, 'error');
                setStatus('Lỗi tạo Gmail', 'stopped');
            }
        } catch (e) {
            addLog(`🔥 Lỗi kết nối backend: ${e.message}`, 'error');
            setStatus('Lỗi kết nối', 'stopped');
        }

        isRunning = false;
        this.disabled = false;
        document.getElementById('btnDungGmail').disabled = true;
    });

    document.getElementById('btnDungGmail').addEventListener('click', function() {
        if (isRunning) {
            stopFlag = true;
            addLog('⏹ Đang gửi tín hiệu dừng...', 'warn');
            // Gửi yêu cầu dừng tới backend (nếu có endpoint)
            fetch('/api/dung_tao_gmail', { method: 'POST' }).catch(() => {});
        } else {
            addLog('ℹ️ Không có tiến trình nào đang chạy', 'info');
        }
    });

    // Khởi tạo
    addLog('🛠 G-Creator Pro sẵn sàng. Dùng tab "Tạo Proxy" trước để lấy proxy.', 'info');
    addLog('📌 Backend Python cần chạy tại /api/lay_proxy, /api/tao_gmail, /api/doc_proxy', 'info');
    setStatus('Sẵn sàng', 'idle');
</script>
</body>
</html>
