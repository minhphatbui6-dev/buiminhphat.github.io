    <style>
        /* Ép toàn bộ ứng dụng thành 1 khối cuộn duy nhất, không chia tách */
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto !important; /* Bật cuộn tổng thể */
            -webkit-overflow-scrolling: touch;
        }
        /* Tuyết rơi cố định theo màn hình nền, không bị trôi khi cuộn */
        @keyframes snowFallEffect {
            0% { transform: translateY(-20px) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(35px); opacity: 0; }
        }
        .snowflake {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            animation: snowFallEffect linear infinite;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            z-index: 0;
        }
    </style>
</head>

    <script>
        const container = document.getElementById('snow-container');
        const snowflakeCount = 55;
        for (let i = 0; i < snowflakeCount; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            const size = Math.random() * 4 + 2;
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;
            snowflake.style.left = `${Math.random() * 100}%`;
            snowflake.style.top = `${Math.random() * -20 - 5}px`;
            snowflake.style.animationDuration = `${Math.random() * 5 + 4}s`;
            snowflake.style.animationDelay = `${Math.random() * 6}s`;
            container.appendChild(snowflake);
        }

        const music = document.getElementById('bg-music');
        function playAudio() {
            music.play().then(() => {
                document.removeEventListener('click', playAudio);
                document.removeEventListener('touchstart', playAudio);
                document.removeEventListener('scroll', playAudio);
            }).catch(error => { console.log("Chờ chạm..."); });
        }
        document.addEventListener('click', playAudio);
        document.addEventListener('touchstart', playAudio);
        document.addEventListener('scroll', playAudio);
    </script>
